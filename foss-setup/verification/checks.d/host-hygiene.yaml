# fix-39 — mini host hygiene: dead-service leftovers + the silent-failure
# surface that let them rot unnoticed.
#   M1:  a dead Pterodactyl panel ran a full LEMP stack + per-minute root cron
#        for 13 months after game hosting moved to AMP on rig.
#   M2:  concurrent etckeeper runs raced on /etc/.git/index.lock and silently
#        dropped /etc history commits (26 failures Jul 01-15).
#   M3:  a spent one-shot timer (media-window-maint) FAILED its only run and
#        sat enabled with NEXT=n/a — the maintenance silently never happened.
#   M62: a cron exec'd a DIRECTORY every midnight for ~2.5 years with zero
#        signal; the tv-torrent cleanup it named never ran (27G accumulated).
# Regression checks pin each exact bug; class checks probe the silent-failure
# mechanism itself (rotten cron targets, spent-but-armed timers, lock races).
checks:
  # ── M1 regression · pterodactyl LEMP stays retired ───────────────────────
  # Consumer end = the host's attack/RAM surface: no LEMP packages installed,
  # no artisan cron entry, no app dir. Archive: mini
  # /var/backups/pterodactyl-retired-20260719 (DB dump + www tarball).
  - id: ptero-lemp-retired
    name: "pterodactyl LEMP stays retired: no packages, no artisan cron, no app dir (M1)"
    host: mini
    cmd: >-
      echo "pkgs=$(dpkg -l 2>/dev/null | awk '$1=="ii"{print $2}' | grep -cE '^(nginx|php8\.3-fpm|mariadb-server|redis-server)$'):cron=$(sudo -n crontab -l 2>/dev/null | grep -c artisan):www=$([ -e /var/www/pterodactyl ] && echo present || echo absent)"
    expect: '^pkgs=0:cron=0:www=absent$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── M2 regression · etckeeper commits are not dropped on lock races ──────
  # Post-fix signature only: the serializing wrapper exhausting its retries
  # (fatal from etckeeper-serialized.sh, or unit exit 75/EX_TEMPFAIL). A quiet
  # journal here means every /etc change landed in git — the consumer end of
  # /etc version history.
  - id: etckeeper-lock-races
    name: "etckeeper dropped no /etc commit to an index.lock race in 24h (M2)"
    host: mini
    cmd: >-
      echo "races=$(journalctl -S -24h --no-pager 2>/dev/null | grep -cE 'etckeeper-serialized[^ ]*: fatal.*index\.lock|etckeeper.*code=exited, status=75')"
    expect: '^races=0$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── M3 class · no spent one-shot timer is still armed ────────────────────
  # A timer with NEXT=n/a that HAS fired before but is still enabled/active is
  # a maintenance job that silently stopped rescheduling (media-window-maint's
  # exact failure mode). Dormant event-armed stock timers (LAST=n/a) pass.
  - id: spent-enabled-timers
    name: "no spent one-shot systemd timer is still enabled/active (M3 class)"
    host: mini
    cmd: /opt/verification/bin/spent-timers.sh
    expect: '^SPENT_ENABLED=NONE$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── M62 class · every absolute-path cron target exists and is executable ─
  # Validates user crontabs + /etc/cron.d so a cron entry whose target rotted
  # (deleted script, renamed dir, exec-of-a-directory) is caught the day it
  # breaks instead of failing silently to nonexistent local mail for years.
  - id: cron-targets-exist
    name: "every absolute-path cron command is an existing executable file (M62 class)"
    host: mini
    cmd: /opt/verification/bin/cron-target-sanity.sh
    expect: '^BROKEN_CRON=NONE$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── M62 regression · the tv-torrent share actually stays pruned ──────────
  # Consumer end of the cleanup: no entry older than 40d may exist (the timer
  # prunes at 30d weekly; 40d = one missed week + slack). Guards both "timer
  # quietly dead" and "timer runs but deletes nothing" — the two ways the old
  # cron failed.
  - id: tv-share-no-ancient-leftovers
    name: "tv-torrent share holds nothing older than 40 days (M62 consumer end)"
    host: mini
    cmd: >-
      echo "stale=$(find /mnt/share/torrents/tv -mindepth 1 -maxdepth 1 -mtime +40 2>/dev/null | wc -l)"
    expect: '^stale=0$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── M62/M3 · the replacement timer is armed and scheduled ────────────────
  # Belt to the healthchecks dead-man's braces (tv-torrent-cleanup pings
  # healthchecks.tv_cleanup_mini_ping_url; grace 6h): if the timer is disabled
  # or has no next elapse, this goes red locally before the dead-man fires.
  - id: tv-cleanup-timer-armed
    name: "tv-torrent-cleanup.timer is enabled with a next fire scheduled"
    host: mini
    cmd: >-
      echo "enabled=$(systemctl is-enabled tv-torrent-cleanup.timer 2>/dev/null):next=$(systemctl list-timers tv-torrent-cleanup.timer --no-legend --plain | awk '{print ($1=="n/a")?"none":"scheduled"}')"
    expect: '^enabled=enabled:next=scheduled$'
    severity: warn
    task_id: fix-39
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── fix-43 regression+class · no orphan dirs or macOS junk in /opt/stacks ─
  # Every top-level /opt/stacks dir must map to a compose project some container
  # (running or stopped) was created from, except the documented allowlist:
  # backups (non-container), wiki (caddy-served build artifact), frigate
  # (staged, deliberately NOT deployed), recyclarr (one-shot `compose run`
  # config dir), meme-review (staged app deliberately RETAINED at its 2026-07-28
  # decommission — data kept on purpose, still mirrored in the repo; fix-69/SM51
  # aligned this allowlist with that retention decision so the warn stops being
  # standing noise). Catches the L2/L72/L85 rot: retired services leaving .env-only
  # dirs behind (litellm/tdarr/maintainerr/dependency-track) and Mac-side
  # AppleDouble junk (._litellm).
  - id: stacks-orphan-dirs
    name: "/opt/stacks has no container-less dirs off-allowlist and no macOS junk"
    host: mini
    cmd: >-
      allow=" backups wiki frigate recyclarr meme-review "; bad="";
      wds=$(docker ps -a --format '{{.Label "com.docker.compose.project.working_dir"}}');
      for d in /opt/stacks/*/; do n=$(basename "$d");
      case "$allow" in *" $n "*) continue;; esac;
      echo "$wds" | grep -qxF "/opt/stacks/$n" || bad="$bad $n";
      done;
      junk=$(find /opt/stacks -maxdepth 1 \( -name '._*' -o -name '.DS_Store' \) -print 2>/dev/null | tr '\n' ' ');
      echo "orphans=${bad:-NONE} junk=${junk:-NONE}"
    expect: '^orphans=NONE junk=NONE$'
    severity: warn
    task_id: fix-43
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── fix-69 (SL40+SL41) class · /tmp + verification-state scratch hygiene ──
  # Past agent sessions left 53+ scratch files in mini /tmp older than 7 days —
  # python probes, json dumps, and TWO world-readable session-cookie files
  # (ls.cookies, romm-cookies.txt) — plus 12+ stale ad-hoc results-<suite>.json
  # in /var/lib/verification whose internal timestamps had rotted (the live
  # timers only refresh results.json + results-tier-fast/url/docker-fleet/media).
  # This sweep fails on: (a) any auth-material file in /tmp (cookies/*.pem/id_*),
  # (b) an excess of >7d-old agent scratch in /tmp (threshold 10 — a little churn
  # is normal, a pile is not), (c) any results-*.json side file older than 14d
  # (well beyond the slowest tier cadence, so live outputs never trip it). Catches
  # the session-cookie/stale-artifact accumulation class at the consumer end —
  # the state dir a future auditor actually reads.
  - id: mini-scratch-hygiene
    name: "mini: no auth-material or aged scratch piling up in /tmp or the verification state dir (SL40/SL41)"
    host: mini
    cmd: >-
      secrets=$(find /tmp -maxdepth 1 \( -name '*.cookies' -o -name '*cookies*.txt' -o -name '*.pem' -o -name 'id_*' \) 2>/dev/null | wc -l);
      scratch=$(find /tmp -maxdepth 1 -mtime +7 \( -type f -o -type d \) ! -path /tmp ! -name '.*-unix' ! -name 'systemd-private-*' ! -name 'tmux-*' 2>/dev/null | wc -l);
      stale=$(for f in /var/lib/verification/results-*.json; do case "$f" in *.streak.json) continue;; esac; python3 -c "import json,sys,datetime,os; t=json.load(open(sys.argv[1])).get('timestamp'); age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(t).astimezone(datetime.timezone.utc)).days; print(os.path.basename(sys.argv[1])) if age>14 else None" "$f" 2>/dev/null; done | grep -c .);
      echo "secrets=$secrets scratch7d=$scratch staleresults14d=$stale";
      [ "$secrets" -eq 0 ] && [ "$scratch" -le 10 ] && [ "$stale" -eq 0 ] && echo HYGIENE_OK || echo HYGIENE_DIRTY
    expect: 'HYGIENE_OK$'
    severity: warn
    task_id: fix-69
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── fix-69 (SL18) regression · orphaned host unpackerr stays retired ─────
  # A deb-packaged unpackerr host service (PID 756, installed 2024) polled the
  # arrs at 192.168.1.2 (a dead subnet — the fleet is 192.168.10.0/24) every
  # ~2min for weeks, erroring into the journal and carrying cleartext arr keys,
  # while the REAL extractor is the NAS container unpackerr. Retired 2026-08-03
  # (apt purge + drop-in removed). Red if a host-level unpackerr unit, process,
  # or package ever reappears on the mini.
  - id: unpackerr-host-retired
    name: "mini: no host-level unpackerr unit/process/package (SL18 — NAS container is the real one)"
    host: mini
    cmd: >-
      u=$(systemctl list-unit-files unpackerr.service --no-legend 2>/dev/null | grep -c .);
      p=$(pgrep -x unpackerr 2>/dev/null | grep -c .);
      k=$(dpkg -l unpackerr 2>/dev/null | awk '$1=="ii"' | grep -c .);
      echo "unit=$u proc=$p pkg=$k";
      [ "$u" -eq 0 ] && [ "$p" -eq 0 ] && [ "$k" -eq 0 ] && echo UNPACKERR_RETIRED || echo UNPACKERR_BACK
    expect: 'UNPACKERR_RETIRED$'
    severity: warn
    task_id: fix-69
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # ── fix-69 (SL7) class · a required reboot must not be deferred forever ──
  # The mini ran 25 days on 5.15.0-185 while 5.15.0-186 + libc6 security updates
  # sat installed-but-inactive behind /var/run/reboot-required, unnoticed. A mini
  # reboot is a fleet-wide outage (it hosts DNS/Caddy/alerting/verification), so
  # it is DELIBERATELY operator-scheduled for the 4-7AM window, NOT automated — but
  # a reboot pending across >45 days of uptime means the schedule slipped and the
  # installed kernel/libc security fixes are stale. Deferral is measured by UPTIME
  # (a reboot clears both /var/run/reboot-required and uptime; the file's own mtime
  # would reset on every new reboot-requiring package and under-report). Warn (never
  # crit) so it nudges without paging nightly. Runbook has the safe drain-order
  # procedure + the ubuntu-pro-client conffile step.
  - id: mini-reboot-not-stale
    name: "mini: no kernel/libc reboot pending across >45d uptime (SL7 — schedule it in the 4-7AM window)"
    host: mini
    cmd: >-
      if [ ! -e /var/run/reboot-required ]; then echo "reboot_pending=no uptime_days=0"; echo REBOOT_OK;
      else up=$(awk '{printf "%d", $1/86400}' /proc/uptime);
      echo "reboot_pending=yes uptime_days=$up";
      [ "$up" -le 45 ] && echo REBOOT_OK || echo REBOOT_STALE; fi
    expect: 'REBOOT_OK$'
    severity: warn
    task_id: fix-69
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true
