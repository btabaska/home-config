# Secrets & filesystem-permission hygiene — fix-23 (quality-gate M7/M26/M43/M44/M45,
# resolved 2026-07-17). The incident class: plaintext credentials sitting world-readable
# (health.env 0777 with an ntfy token — a token that was ADMIN-scoped, read-write to all
# topics — plus broad 0777 across /volume1/docker), and live credentials existing only on
# host filesystems while the handoff vault said ''. The vault-side class check is
# scripts/secrets/vault-lint.py, which runs on the macbook (the vault never leaves it)
# and is wired into publish-deploy.sh; these checks cover the host-side class.
checks:
  # fix-23 regression (M7): the exact file that leaked. Ownership root:root mode 600 —
  # the consumer (nas-docker-health.sh) runs as root from a DSM scheduled task, so
  # nothing but root needs to read it. stat works unprivileged (needs only dir x).
  - id: nas-health-env-perms
    name: "health.env is root:root 600 (was 0777 with a live ntfy admin token)"
    host: nas
    cmd: stat -c '%a %U:%G' /volume1/scripts/nas/health.env
    expect: '^600 root:root$'
    severity: crit
    task_id: fix-23
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true

  # fix-23 class check (M7): no credential-bearing file under /volume1/docker may be
  # group- or world-readable. Catches the drift path that created M7: DSM share ACLs
  # default new files to 0777, and app upgrades rewrite config.xml — so a green result
  # today can regress on the next container update. btabaska owns the app dirs, so an
  # unprivileged find sees them all; DSM-internal dirs are excluded.
  # fix-92 (2026-08-23): three hardenings after the fix-23 check chronically
  # TIMED OUT (exit 124 -> false-CRIT) for 10+ days. (1) IO-ROBUST: the old find
  # walked the ENTIRE /volume1/docker tree (incl. deep data dirs) — 60s+ under load;
  # `-maxdepth 6` bounds it to the <app>/config/<file> depth where secrets live and
  # completes in ~0.05s (ionice is unavailable on DSM). A genuine 45s timeout now
  # degrades to IO_DEFERRED (a safety-net pass) instead of a false-CRIT. (2) FILTER
  # broadened: 0644 secret files escaped the old .env/.ini/.xml filter — added
  # config.yaml/.yml, *.conf, settings.json, *.key (excluding public *cert*.pem,
  # which are meant to be world-readable). (3) The 2026-08-23 sweep found + fixed
  # 7 real 0644/0755 exposures this way (stash config.yml, bazarr/shelfmark/beets
  # configs, CWA .key, unpackerr.conf, scrutiny influxdb config -> all chmod 600).
  # These files are POSIX-authoritative (no synoacl override), so 600 is effective.
  - id: nas-secret-file-perms
    name: "no group/world-readable secret config under /volume1/docker (env/ini/xml/yaml/conf/json/key)"
    host: nas
    timeout: 60
    cmd: >-
      out=$(timeout 45 find /volume1/docker -maxdepth 6 \( -name @eaDir -o -name '#recycle' \) -prune -o
      -type f \( -name '*.env' -o -name '.env' -o -name 'config.ini' -o -name 'config.xml'
      -o -name 'config.yaml' -o -name 'config.yml' -o -name '*.conf' -o -name 'settings.json'
      -o -name '*.key' \) ! -name '*cert*.pem' -perm /0044 -print 2>/dev/null); rc=$?;
      if [ "$rc" = 124 ]; then echo IO_DEFERRED; else printf '%s' "$out" | grep -c . ; fi
    expect: '^(0|IO_DEFERRED)$'
    severity: crit
    task_id: fix-23
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true

  # fix-23 class check (M7 broad): nothing world-writable anywhere under the docker
  # tree or /volume1/scripts (the audit found near-everything 0777). World-write is how a
  # compromised low-priv container tampers with a neighbour's config.
  # fix-92: same IO-robustness treatment as nas-secret-file-perms — the unbounded
  # find timed out (exit 124 -> false-fail). -maxdepth 6 bounds it to the config
  # depth (world-writable config is the tamper concern) and completes fast; a genuine
  # 45s timeout degrades to IO_DEFERRED (safety-net pass) not a false-fail.
  - id: nas-worldwritable-sweep
    name: "no world-writable files under /volume1/docker or /volume1/scripts (config depth)"
    host: nas
    timeout: 60
    cmd: >-
      out=$(timeout 45 find /volume1/docker /volume1/scripts -maxdepth 6 \( -name @eaDir -o -name '#recycle' \) -prune -o
      ! -type l -perm -0002 -print 2>/dev/null); rc=$?;
      if [ "$rc" = 124 ]; then echo IO_DEFERRED; else printf '%s' "$out" | grep -c . ; fi
    expect: '^(0|IO_DEFERRED)$'
    severity: warn
    task_id: fix-23
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true

  # fix-23 class check (token-leak blast radius): the leaked nas-health token was
  # printed into a committed audit doc; it is revoked, but the guarantee that makes a
  # future leak survivable is NTFY_AUTH_DEFAULT_ACCESS=deny-all — anonymous publish to
  # the alert topic must stay 403 so alerts can't be spoofed/flooded without a token.
  - id: ntfy-anon-publish-denied
    name: "ntfy denies anonymous publish to homelab-alerts (deny-all intact)"
    host: mini
    cmd: curl -s -o /dev/null -m 8 -w '%{http_code}' -X POST -d probe https://ntfy.tabaska.us/homelab-alerts
    expect: '^403$'
    severity: crit
    task_id: fix-23
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true

  # fix-53 class check (SM2/SM3): the Jul 27 mylar3 deploy reintroduced the fix-23
  # class — the LSIO mylar3 image ignores the UMASK env var (its s6 run script execs
  # mylar with no `umask`), so config.ini was created 0644 with 23 credential-class
  # keys. The structural fix is a PID-1 umask in the compose entrypoint
  # (`umask 077; exec /init`) which secures config.ini's create path. This guards the
  # mechanism: if a future redeploy drops the entrypoint umask, the crit
  # nas-secret-file-perms check would only fail AFTER the app next recreates config.ini
  # — this catches the drift at deploy time instead. (The world-writable cache half of
  # SM3 is defeated by mylar's os.umask(0) leak and is handled by the every-15-min DSM
  # task scripts/nas/mylar3-perms-guard.sh, whose outcome nas-worldwritable-sweep sees.)
  - id: nas-mylar3-umask-guard
    name: "mylar3 container entrypoint sets umask 077 (fix-53 structural fix intact)"
    host: mini
    cmd: >-
      ep=$(printf '%s\n' "$NAS_SUDO_PASSWORD"
      | ssh -o BatchMode=yes -o ConnectTimeout=10 nas
      "sudo -S -p '' /usr/local/bin/docker inspect mylar3 --format '{{json .Config.Entrypoint}}'"
      2>/dev/null); echo "$ep" | grep -q 'umask 077' && echo umask=set || echo "umask=MISSING ep=${ep:-inspect_failed}"
    expect: '^umask=set$'
    severity: warn
    task_id: fix-53
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true

  # fix-53 regression check (SM42): the /volume1/backups shared folder (HA's daily
  # off-eMMC ENCRYPTED backup leg, written by the ha-backup SMB user) granted full
  # rwxpdD (write + DELETE) to every NAS group — media, users, http, household,
  # docker-service — via inheritable ACEs, so a compromised web service (http) or
  # container (docker-service), or any account, could silently delete/replace the only
  # off-eMMC HA backup. scripts/nas/harden-backups-acl.sh downgraded those groups to
  # read-only, keeping only administrators (restore) + ha-backup (writer) with write.
  # This asserts the source template (the folder ACL) AND the newest tar grant NO
  # non-writer group write/delete. Reads over ssh sudo (synoacltool is root-only); the
  # folder is always present so this never vacuously passes. warn (not crit): read is
  # mitigated (tars are encrypted, key at vault hosts.ha.backup_password), the risk is
  # integrity/availability, other backup legs exist, and the ACL is durable — a crit
  # here would only add crit-channel noise.
  - id: nas-ha-backup-acl
    name: "HA offsite backup tars: only administrators/ha-backup can write/delete (SM42)"
    host: mini
    cmd: >-
      n=$(printf '%s\n' "$NAS_SUDO_PASSWORD"
      | ssh -o BatchMode=yes -o ConnectTimeout=10 nas
      "sudo -S -p '' sh -c 'F=\$(ls -1t /volume1/backups/*.tar 2>/dev/null | head -1);
      /usr/syno/bin/synoacltool -get /volume1/backups;
      [ -n \"\$F\" ] && /usr/syno/bin/synoacltool -get \"\$F\"'"
      2>/dev/null | grep -Ec 'group:(media|users|http|household|docker-service):allow:rwxpdD');
      echo "backup_open_write_aces=${n:-query_failed}"
    expect: '^backup_open_write_aces=0$'
    severity: warn
    task_id: fix-53
    runbook: wiki/runbooks/backup-restore.md
    enabled: true

  # fix-84 (UH2) class check: the recurrence guard for "a live secret got committed
  # to git". vault-lint only checks the vault file; the 2026-08-23 sweep found a live
  # playit SECRET_KEY + adguard_nas admin password + ntfy tokens pasted into a
  # committed audit doc and pushed to both remotes. The STRONG, vault-aware gate is
  # Mac-side in publish-deploy.sh (repo-secret-scan.py — blocks the push before it
  # reaches a remote). This mini-side monitor is defence-in-depth over what actually
  # LANDED: it fetches origin/main and git-greps the pushed tree for secret-shaped
  # strings (pattern-only; no vault on mini), so a leak that somehow bypassed the
  # publish gate still pages. Greps the ref directly (not a working tree) so it is
  # independent of the /opt/foss-setup clone freshness (fix-80). unpackerr.conf's
  # sec-10 keys are excluded here (tracked separately); tk_/PEM/AKIA are the classes.
  - id: repo-secret-scan-clean
    tier: daily
    name: "no secret-shaped strings in pushed origin/main (fix-84 recurrence monitor)"
    host: mini
    cmd: >-
      cd /opt/foss-setup 2>/dev/null && git fetch -q origin main 2>/dev/null;
      hits=$(git -C /opt/foss-setup grep -I -n -E 'tk_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}' origin/main -- . ':!*.example' ':!*unpackerr.conf' 2>/dev/null | grep -vi redacted | wc -l | tr -d ' ');
      if [ "${hits:-1}" -eq 0 ]; then echo "SECRETS-CLEAN pushed origin/main pattern-scan 0 hits"; else echo "SECRETS-FOUND $hits secret-shaped string(s) in origin/main"; fi
    expect: '^SECRETS-CLEAN'
    severity: crit
    task_id: fix-84
    runbook: wiki/runbooks/secrets-hygiene.md
    enabled: true
