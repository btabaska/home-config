# Git hygiene on mini: config-managed dirs must be committed.
# btabaska has passwordless sudo on mini; sudo is needed to stat root-owned volume dirs.
checks:
  - id: git-stacks-clean
    name: "/opt/stacks working tree is clean"
    host: mini
    cmd: sudo git -C /opt/stacks status --porcelain | wc -l
    expect: '^0$'
    severity: warn
    task_id: docker-12
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  - id: git-foss-setup-clean
    name: "/opt/foss-setup working tree is clean"
    host: mini
    cmd: sudo git -C /opt/foss-setup status --porcelain | wc -l
    expect: '^0$'
    severity: warn
    task_id: glue-08
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # `etckeeper unclean` exits 0 when /etc is DIRTY, 1 when clean — so we expect exit 1.
  - id: git-etckeeper-clean
    name: "/etc committed in etckeeper (no uncommitted drift)"
    host: mini
    cmd: sudo etckeeper unclean
    expect_exit: 1
    severity: warn
    task_id: glue-01
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # wiki-05 "same-commit rule": any change to a source that feeds a generated wiki
  # page (tasks/progress JSON, checks.d/*.yaml, the docker-stack service catalog +
  # enrichment, or a script) must regenerate that page IN THE SAME COMMIT. This
  # proves it against the CURRENT forgejo HEAD: a cache clone (forgejo is on this
  # host, so fetch is local + fast) is fast-forwarded to HEAD, then
  # wiki-drift-check.sh checks HEAD out into a throwaway worktree, re-runs every
  # page generator, and diffs. exit 1 (=> check fail) means a source changed but its
  # generated page did not. Heavier than a probe (clone/regenerate) — daily sweep.
  - id: wiki-drift
    name: "wiki generated pages in sync with sources (same-commit rule)"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      git -C "$D" worktree prune 2>/dev/null &&
      bash "$D/foss-setup/scripts/wiki/wiki-drift-check.sh"
    expect_exit: 0
    severity: warn
    task_id: wiki-05
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-41 (classes M48/M51): every live mini stack with a top-level compose must
  # have a byte-identical mirror at configs/docker-stack/stacks/<name>/ keeping
  # the SAME filename, and every live .env key must appear in the repo
  # .env.example (one-way: live-only keys are what a rebuild silently drops —
  # this is how caddy ACME_EMAIL, musicseerr LIDARR_API_KEY, navidrome
  # ND_BACKUP_*, ntfy NTFY_UPSTREAM_BASE_URL went missing, and how the forgejo
  # mirror hid unfound in configs/git/ for weeks). Judged against a fetched
  # origin/main clone (shared cache dir with wiki-drift; the runner is
  # sequential and both reset --hard to FETCH_HEAD first). Clone/fetch runs
  # unprivileged (root has no forgejo ssh alias); the script runs under sudo to
  # read every stack's .env.
  - id: stack-mirror-drift
    name: "every live mini stack byte-mirrored in repo (+ .env keys in example)"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      sudo bash "$D/foss-setup/scripts/verification/stack-mirror-check.sh" mirrors
    expect: STACK-MIRRORS-OK
    severity: warn
    task_id: fix-41
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-41 (class M49): hosts/macmini/compose-images.txt must contain exactly the
  # image NAMES present in live top-level compose files — no phantoms from
  # recursive-grep sweep-ins (.bak copies, recyclarr's embedded trash-guides
  # clone, the built wiki site) and nothing live left unlisted. Names, not pins:
  # weekly-snapshot pin lag is expected; a name mismatch is pollution or a
  # missed add/retire (100%-coverage tripwire).
  - id: manifest-image-purity
    name: "compose-images.txt image names == live top-level compose image names"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      sudo bash "$D/foss-setup/scripts/verification/stack-mirror-check.sh" manifest
    expect: MANIFEST-PURITY-OK
    severity: warn
    task_id: fix-41
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-43 (class of L68): tracked-but-ignored files hide from `git status` yet
  # ship in every clone — 4 compiled __pycache__ .pyc files sat in the index for
  # weeks because they were committed before the ignore rule landed. Property of
  # index + .gitignore, so the fetched cache clone is authoritative.
  - id: repo-tracked-ignored
    name: "no tracked-but-ignored files in the homelab repo (L68 class)"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      git -C "$D" ls-files -i -c --exclude-standard | wc -l
    expect: '^0$'
    severity: warn
    task_id: fix-43
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-43 (regression for L77/L78): the generated tracker views must stay
  # arithmetically consistent with tasks.json + progress.json — dual-status
  # tasks (done AND retired, e.g. sbom-01/04) count exactly once (retired wins),
  # todo.md's summary line adds up and matches a fresh recount, and the wiki
  # roadmap index has no negative Open cell (the exact L77 symptom).
  - id: tracker-count-sanity
    name: "tracker views arithmetically consistent with tasks/progress JSONs"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      python3 "$D/foss-setup/scripts/verification/tracker-count-check.py" "$D"
    expect: TRACKER-COUNTS-OK
    severity: warn
    task_id: fix-43
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-44 (M46 class): tracker-count-sanity proves the generated VIEWS match
  # the JSONs; this proves the JSON SOURCES themselves are coherent — every
  # done/retired/deferred/reopened id resolves to a task definition (the
  # nas-00e orphan-id regression), no duplicate task ids, no contradictory
  # status combos, and the vestigial _meta task_count/completed_count fields
  # (removed by fix-44: no code consumer, they only drifted) stay dead.
  - id: tracker-integrity
    name: "tracker JSON sources coherent (ids resolve, no dup/contradiction, _meta counts dead)"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      python3 "$D/foss-setup/scripts/verification/tracker-integrity.py"
    expect: 'tracker coherent'
    severity: warn
    task_id: fix-44
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-43 (class of L86): hand-copied systemd unit files (ansible-pull
  # service+timer on mini AND rig) must stay byte-identical to the repo copy —
  # nothing in site.yml converges them, so drift is silent until a run misses
  # (the 2026-07-15 stale-playbook-path failure, L6). Unreachable rig = fail.
  - id: unit-file-drift
    name: "deployed ansible-pull units byte-match the repo on mini + rig (L86 class)"
    host: mini
    cmd: >-
      D=/var/lib/verification/wiki-drift-repo;
      { git -C "$D" rev-parse --git-dir >/dev/null 2>&1 || { rm -rf "$D"; git clone -q forgejo:home/homelab "$D"; }; } &&
      git -C "$D" fetch -q origin main &&
      git -C "$D" reset --hard -q FETCH_HEAD &&
      bash "$D/foss-setup/scripts/verification/unit-drift-check.sh" "$D"
    expect: UNIT-DRIFT-OK
    severity: warn
    task_id: fix-43
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # glue-04b: the chezmoi dotfiles rollout to rig + mini must stay in sync with
  # its applied source — a live edit to ~/.zshrc / starship.toml / ghostty config
  # / fish config that never lands back in the `home/dotfiles` source (or a source
  # update never `chezmoi apply`ed) is exactly the repo↔live drift this file
  # guards, just for the personal-config plane instead of the stack plane.
  #
  # We assert CONTENT parity, not `chezmoi status` cleanliness: chezmoi derives a
  # dot_-file's target mode from the *runtime umask*, and mini's login shells run
  # umask 002 (group-writable) while the systemd runner defaults to 022 — so a
  # naive `chezmoi status` flaps 0↔7 purely on cosmetic mode bits and would page a
  # fake drift. `chezmoi diff | grep -c '^@@'` counts real content hunks only
  # (mode-only diffs carry no @@ hunk), which is umask-agnostic and uniform across
  # both hosts. Runner is btabaska on mini; rig is reached over the same ssh key
  # the other cross-host checks use (unreachable rig => non-zero => fail).
  - id: dotfiles-content-clean
    name: "chezmoi dotfiles have no uncommitted content drift on mini + rig (glue-04b)"
    host: mini
    cmd: >-
      m=$(chezmoi diff 2>/dev/null | grep -c '^@@' || true);
      r=$(ssh -o BatchMode=yes -o ConnectTimeout=10 rig "chezmoi diff 2>/dev/null | grep -c '^@@'" </dev/null | tr -d '[:space:]');
      echo "mini_hunks=$m rig_hunks=$r";
      { [ "$m" = 0 ] && [ "$r" = 0 ]; } && echo DOTFILES-CONTENT-CLEAN
    expect: DOTFILES-CONTENT-CLEAN
    severity: warn
    task_id: glue-04b
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # ai-03: the rig's local-ai-tooling repo (~/Documents/GitHub/local-ai-tooling)
  # is a SECOND control plane — the whole AI stack's config (litellm, llama-swap,
  # ollama tune, fleet-mcp, seed scripts) lives there, in a repo foss-setup's
  # guardrails could not see. It has TWO remotes (origin = github, forgejo =
  # git.tabaska.us via the rig-workstation id_forgejo user key); ai-02 made the
  # rule "every commit lands on BOTH". This is the git-stacks-clean analog for
  # that plane: the checkout must be porcelain-clean AND its HEAD must be present
  # on BOTH remotes (committed-but-unpushed, or pushed-to-github-only, is exactly
  # the orphaned-drift class the fleet is paranoid about). Runs on rig (runner
  # ssh's in); ls-remote uses the same keys the rig's own pushes use, so an
  # unreachable rig / broken key => non-zero => FAIL. HEAD here is the default-
  # branch (main) tip on each side — the branch every commit is published on.
  - id: ai-tooling-clean-pushed
    name: "rig local-ai-tooling repo is clean AND HEAD pushed to both remotes (ai-03)"
    host: rig
    cmd: >-
      cd ~/Documents/GitHub/local-ai-tooling &&
      dirty=$(git status --porcelain | wc -l | tr -d '[:space:]') &&
      head=$(git rev-parse HEAD) &&
      o=$(git ls-remote origin HEAD | awk 'NR==1{print $1}') &&
      f=$(git ls-remote forgejo HEAD | awk 'NR==1{print $1}') &&
      echo "dirty=$dirty head=${head:0:12} origin=${o:0:12} forgejo=${f:0:12}" &&
      { [ "$dirty" = 0 ] && [ -n "$head" ] && [ "$head" = "$o" ] && [ "$head" = "$f" ]; } && echo AI-TOOLING-CLEAN-PUSHED
    expect: AI-TOOLING-CLEAN-PUSHED
    severity: warn
    task_id: ai-03
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # ai-04: the rig's local-ai-tooling docker/.env holds the AI stack's bootstrap
  # secrets (litellm master/salt, litellm-db postgres pw, OWUI secret, kagi key,
  # lumiverse/marinara auth + virtual keys). Each real secret has a durable second
  # copy in the vault (foss-setup/.handoff-secrets.yaml ai_stack.* / litellm.* /
  # open_webui.*), MAPPED key-by-key in docker/.env.example (each line carries a
  # `-> vault <path>` or `non-secret/regenerable` note). This tripwire enforces
  # that mapping stays complete: every live .env key must appear in .env.example,
  # so a future-added secret can't silently escape the vault (the .env itself is
  # gitignored + rig-only, so .env.example is the only place git can see the shape).
  # Pure-shell (no inline python) per the checksd folding hazard; runs on rig.
  - id: ai-tooling-env-example-parity
    name: "rig local-ai-tooling docker/.env keys all mapped in .env.example (ai-04)"
    host: rig
    cmd: >-
      cd ~/Documents/GitHub/local-ai-tooling/docker &&
      exk=$(grep -vE '^#|^$' .env.example | cut -d= -f1) &&
      miss=$(for k in $(grep -vE '^#|^$' .env | cut -d= -f1); do echo "$exk" | grep -qx "$k" || echo "$k"; done | wc -l | tr -d '[:space:]') &&
      echo "keys-missing-from-example=$miss" &&
      [ "$miss" = 0 ] && echo ENV-EXAMPLE-PARITY-OK
    expect: ENV-EXAMPLE-PARITY-OK
    severity: warn
    task_id: ai-04
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-65 (SH16 + SL28 class): the dual-remoted repos must have their Forgejo
  # (no-cloud, authoritative) mirror and their GitHub mirror at the SAME commit.
  # ai-tooling-clean-pushed already checks local-ai-tooling from the RIG checkout,
  # but two real gaps slipped past it: local-ai-tooling's Forgejo mirror sat 16
  # commits BEHIND GitHub (SH16) and dotfiles' GitHub mirror sat 2 commits BEHIND
  # Forgejo (SL28) — opposite directions, and dotfiles had NO check at all. This
  # compares the two REMOTES directly (no local checkout needed, so it catches
  # drift even if the workstation clone is gone/stale) and fails on ANY inequality
  # in EITHER direction. Runs on mini as btabaska (has the forgejo ssh alias + the
  # forgejo server is local; github over https, both repos public). Pure shell.
  - id: dual-remote-mirror-parity
    name: "dual-remoted repos: Forgejo mirror == GitHub mirror (both directions)"
    host: mini
    cmd: >-
      df_f=$(git ls-remote forgejo:home/dotfiles main | awk 'NR==1{print $1}') &&
      df_g=$(git ls-remote https://github.com/btabaska/dotfiles main | awk 'NR==1{print $1}') &&
      ai_f=$(git ls-remote forgejo:home/local-ai-tooling main | awk 'NR==1{print $1}') &&
      ai_g=$(git ls-remote https://github.com/btabaska/local-ai-tooling main | awk 'NR==1{print $1}') &&
      echo "dotfiles f=${df_f:0:12} g=${df_g:0:12} | local-ai-tooling f=${ai_f:0:12} g=${ai_g:0:12}" &&
      { [ -n "$df_f" ] && [ "$df_f" = "$df_g" ] && [ -n "$ai_f" ] && [ "$ai_f" = "$ai_g" ]; } &&
      echo DUAL-REMOTE-PARITY-OK
    expect: DUAL-REMOTE-PARITY-OK
    severity: warn
    task_id: fix-65
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # fix-65 (SM16): the rig rebuildability loop had a silent-partial-failure — the
  # deploy copied export-manifests.sh to /opt/scripts/inventory/ but NOT its
  # sibling gen-inventory-md.sh, so the weekly export skipped the inventory.md
  # refresh under exit 0 (the dead-man still pinged green). This probes the
  # CONSUMER end: the helper must be present AND the most recent export run must
  # have regenerated inventory.md rather than logging the skip. Host rig (as
  # btabaska, who can read the unit journal).
  - id: export-manifests-inventory-fresh
    name: "rig export-manifests refreshes inventory.md (helper present, no silent skip)"
    host: rig
    cmd: >-
      test -x /opt/scripts/inventory/gen-inventory-md.sh &&
      last=$(journalctl -u export-manifests.service --no-pager 2>/dev/null | grep -Eo 'Regenerating inventory.md|skipping inventory.md refresh' | tail -1) &&
      echo "gen-inventory=present last-leg=${last:-none}" &&
      [ "$last" = "Regenerating inventory.md" ] &&
      echo EXPORT-MANIFESTS-INVENTORY-OK
    expect: EXPORT-MANIFESTS-INVENTORY-OK
    severity: warn
    task_id: fix-65
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true
