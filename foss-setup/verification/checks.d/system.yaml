# System health on mini + network-level checks.
checks:
  - id: sys-ansible-pull
    name: "ansible-pull last run succeeded"
    host: mini
    cmd: systemctl show ansible-pull.service -p ExecMainStatus
    expect: '^ExecMainStatus=0$'
    severity: crit
    task_id: glue-08
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  - id: sys-failed-units
    name: "no failed systemd units on mini"
    host: mini
    cmd: systemctl --failed --no-legend | wc -l
    expect: '^0$'
    severity: warn
    task_id: glue-08
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  - id: sys-disk-root
    name: "root filesystem below 85% used"
    host: mini
    cmd: df --output=pcent / | tail -1 | tr -dc '0-9'
    expect: '^([0-7]?[0-9]|8[0-5])$'
    severity: crit
    task_id: glue-08
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  - id: sys-docker-restart-loops
    name: "no container with RestartCount > 3"
    host: mini
    cmd: docker ps -q | xargs -r docker inspect --format '{{.Name}} {{.RestartCount}}' | awk '$2>3' | wc -l
    expect: '^0$'
    severity: warn
    task_id: docker-12
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  - id: sys-tailscale-peers
    name: "tailscale up with at least 1 online peer"
    host: mini
    cmd: tailscale status --json | python3 -c 'import json,sys;d=json.load(sys.stdin);print(sum(1 for p in d.get("Peer",{}).values() if p.get("Online")))'
    expect: '^[1-9][0-9]*$'
    severity: crit
    task_id: net-05
    runbook: wiki/docs/runbooks/dns-outage.md
    enabled: true

  - id: sys-home-assistant
    name: "Home Assistant answers on 192.168.10.50:8123"
    host: url
    cmd: curl -s -o /dev/null -m 8 -w '%{http_code}' http://192.168.10.50:8123/
    expect: '^200$'
    severity: crit
    task_id: ha-01
    runbook: wiki/docs/runbooks/ha-health.md
    enabled: true

  # seedbox: SSH blocked by provider network ACL — no probe path from the LAN.
  # Re-enable if/when an API or SSH route exists.
  - id: sys-seedbox-ssh
    name: "seedbox reachable over SSH (disabled: SSH blocked by ACL)"
    host: local
    cmd: ssh -o BatchMode=yes -o ConnectTimeout=8 seedbox 'echo seedbox-ok'
    expect: '^seedbox-ok$'
    severity: info
    task_id: seed-01
    runbook: wiki/docs/runbooks/seedbox-exposure.md
    enabled: false   # SSH blocked by ACL — skip until a probe path exists

  - id: sys-docker-subnet-squat
    name: "no docker network overlaps 192.168.0.0/16 (LAN/VLAN space)"
    host: mini
    cmd: >-
      docker network ls -q | xargs -n1 docker network inspect
      --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null | grep -c '^192\.168\.' || true
    expect: '^0$'
    severity: warn
    task_id: ha-19
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # fix-66 (SH6) — sharper, CONSUMER-END sibling of sys-docker-subnet-squat above.
  # sys-docker-subnet-squat catches ANY docker subnet in 192.168.0.0/16 (broad
  # hygiene, ha-19-owned — still warns on the scrutiny-collector + terraria squats).
  # This one does real subnet-arithmetic (ipaddress.overlaps) and CRITs only when a
  # docker bridge actually swallows a VLAN a Trusted host must ROUTE to — Trusted
  # itself (10) and IoT (20, the Trusted->IoT allow path for smart-home control).
  # That is the exact failure mode SH6 hit: journaling's 192.168.16.0/20 bridge
  # (.16.0-.31.255) contained the IoT /24, so mini blackholed all Hue/IoT traffic
  # into the bridge while net-trusted-to-iot-reachable went BAD. A /20 swallowing a
  # /24 is caught (overlaps() is direction-agnostic). Cameras(30)/Work(40)/Guest(50)
  # are firewall-isolated from Trusted, so an overlap there is latent, not a mini
  # reachability outage — those stay under the broad ha-19 squat guard. crit: an
  # active overlap here is a live smart-home outage, not a slow-degrade.
  - id: sys-docker-vlan-overlap
    name: "no docker network overlaps a routable VLAN (Trusted 192.168.10 / IoT 192.168.20)"
    host: mini
    cmd: >-
      docker network ls -q | xargs -n1 docker network inspect
      --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}' 2>/dev/null | python3 -c 'import sys,ipaddress; V=[ipaddress.ip_network(x) for x in ("192.168.10.0/24","192.168.20.0/24")]; N=[ipaddress.ip_network(t,strict=False) for t in sys.stdin.read().split() if "/" in t]; bad=["%s->%s"%(n,v) for n in N for v in V if n.overlaps(v)]; print("VLAN_OVERLAP_OK n=%d"%len(N) if not bad else "VLAN_OVERLAP_FAIL "+",".join(bad))'
    expect: '^VLAN_OVERLAP_OK n=[0-9]+$'
    severity: crit
    task_id: fix-66
    runbook: wiki/docs/runbooks/host-hygiene.md
    enabled: true

  # glue-10 — per-disk SMART health, the blind spot Beszel/Kuma don't cover.
  # CONSUMER-end: asks the Scrutiny hub (omnibus on the NAS) for its rollup and
  # asserts every fleet disk (7: 1 mini SSD + 3 NAS SATA + 3 rig NVMe) is present
  # AND has device_status 0 (SMART pass). A failing/aging drive flips device_status
  # non-zero -> smart_FAIL; a wiped hub or dead collectors drop the count -> also
  # FAIL. Data persists in Scrutiny's registry across restarts, so the >=7 floor is
  # stable. warn per the pitfall (don't page on a slow-degrading drive at 3am).
  - id: sys-disk-smart-health
    name: "Scrutiny reports all 7 fleet disks present with 0 failed SMART status"
    host: mini
    cmd: >-
      curl -sm 10 http://nas:8080/api/summary
      | python3 -c 'import sys,json;d=json.load(sys.stdin);s=d.get("data",{}).get("summary",{});bad=[k for k,v in s.items() if v.get("device",{}).get("device_status",0)];print("smart_ok drives=%d" % len(s)) if (d.get("success") and len(s)>=7 and not bad) else print("smart_FAIL drives=%d failed=%d" % (len(s),len(bad)))'
      || echo smart_ERR
    expect: '^smart_ok drives=[0-9]+$'
    severity: warn
    task_id: glue-10
    runbook: wiki/docs/runbooks/fleet-hygiene.md
    enabled: true

  # fix-103 (UL68): sys-disk-smart-health above asserts drives are PRESENT + SMART-
  # passing, but Scrutiny retains the last-known payload across restarts, so if the
  # daily 06:00 collector→hub publish genuinely STOPPED landing the rollup would keep
  # showing stale-but-green data — the exact "green-masks-a-real-failure" gap UL68
  # flagged (the collector logs a client-side POST timeout on ~12/21 days yet exits 0,
  # and the data does land, so the timeout log is NOT a reliable failure signal). This
  # reframes to the CONSUMER end: assert every device's smart.collector_date is within
  # 40h (daily 06:00 cadence + one grace day). A device whose publish truly stopped
  # goes stale here and pages, decoupled from the benign client-side timeout noise.
  - id: sys-disk-smart-fresh
    name: "Scrutiny SMART data is fresh for all disks (collector→hub publish still landing, not stale-green)"
    host: mini
    cmd: >-
      curl -sm 10 http://nas:8080/api/summary
      | python3 -c 'import sys,json,datetime;
      d=json.load(sys.stdin); s=d.get("data",{}).get("summary",{});
      now=datetime.datetime.now(datetime.timezone.utc);
      ages={k:(now-datetime.datetime.fromisoformat((((v.get("smart") or {}).get("collector_date")) or "1970-01-01T00:00:00Z").replace("Z","+00:00"))).total_seconds()/3600.0 for k,v in s.items()};
      stale=[k for k,a in ages.items() if a>40];
      mx=max(ages.values(), default=1e9);
      print("smart_fresh drives=%d max_age=%.1fh" % (len(s), mx)) if (d.get("success") and len(s)>=7 and not stale) else print("smart_STALE drives=%d stale=%d max_age=%.1fh" % (len(s), len(stale), mx))'
      || echo smart_fresh_ERR
    expect: '^smart_fresh drives=[0-9]+ '
    severity: warn
    task_id: glue-10
    runbook: wiki/docs/runbooks/fleet-hygiene.md
    enabled: true
