# Notes / knowledge-base apps (read-27). Trilium (TriliumNext) Obsidian-replacement trial.
#
# Consumer-end probe, not liveness: the container-health + coverage-manifest checks in
# docker-fleet.yaml already prove the container is up. This walks the REAL path a user hits —
# DNS (*.tabaska.us wildcard) -> Caddy TLS (DNS-01 cert) -> the trilium:8080 upstream with
# TRILIUM_NETWORK_TRUSTEDREVERSEPROXY -> the app actually serving its shell (setup or login
# page). A 200 whose body carries the Trilium app marker proves every hop, before and after
# the first-run setup wizard. (A deeper authenticated ETAPI probe can be added once a login +
# API token exist.)
checks:
  - id: trilium-web-serves-app
    name: "Trilium serves its app shell through Caddy (read-27 consumer end)"
    host: mini
    cmd: >-
      code=$(curl -s -o /tmp/trilium-probe.html -m 20 -w '%{http_code}' https://trilium.tabaska.us/);
      if [ "$code" = "200" ] && grep -qi 'trilium' /tmp/trilium-probe.html;
      then echo TRILIUM_OK; else echo "TRILIUM_BAD code=$code"; fi;
      rm -f /tmp/trilium-probe.html
    expect: '^TRILIUM_OK$'
    severity: warn
    task_id: read-27
    runbook: wiki/docs/runbooks/notes-trilium.md
    enabled: true
