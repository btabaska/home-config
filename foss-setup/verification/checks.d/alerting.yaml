# Alerting-chain checks — guard the 2026-07-08 overnight remediation against
# regression (audit found the whole chain dead-ended: 0 subscribers, dead
# transports, empty Healthchecks, DSM-wiped schedules).
checks:
  - id: alert-ntfy-healthy
    name: "ntfy serving and healthy via vhost"
    host: url
    cmd: curl -sk -m 8 https://ntfy.tabaska.us/v1/health
    expect: '"healthy"\s*:\s*true'
    severity: crit
    task_id: docker-09
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: alert-ntfy-upstream-relay
    name: "ntfy iOS upstream relay configured (NTFY_UPSTREAM_BASE_URL)"
    host: mini
    cmd: docker exec ntfy sh -c 'printenv NTFY_UPSTREAM_BASE_URL' | grep -x 'https://ntfy.sh'
    expect: 'ntfy\.sh'
    severity: warn
    task_id: docker-09
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: alert-diun-mini-up
    name: "Diun (mini) container healthy"
    host: mini
    cmd: docker inspect -f '{{.State.Health.Status}}' diun
    expect: '^healthy$'
    severity: warn
    task_id: docker-12
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: alert-diun-nas-up
    name: "Diun (NAS) container running"
    host: nas
    # scoped NOPASSWD sudoers (/etc/sudoers.d/verification-diun) permits exactly
    # this inspect; DSM ps hides other users' processes from non-root.
    cmd: sudo -n /usr/local/bin/docker inspect -f '{{.State.Status}}' diun
    expect: '^running$'
    severity: warn
    task_id: docker-12
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: alert-healthchecks-checks-defined
    name: "Healthchecks has its dead-man checks (>=6) and ntfy channel"
    host: mini
    # `shell -v 0` suppresses Django 5.2's "N objects imported automatically"
    # auto-import banner (SM46, fix-61) so it doesn't become line 1 of the check
    # output and mask the real payload in last-summary.md / triage input.
    cmd: docker exec healthchecks python3 /opt/healthchecks/manage.py shell -v 0 -c "from hc.api.models import Check, Channel; print('checks='+str(Check.objects.count()), 'ntfy='+str(Channel.objects.filter(kind='ntfy').count()))"
    # floor, not a fixed count — dead-mans grow with the fleet (10 as of
    # 2026-07-10: +recyclarr, ai-stack-rig, verification-quick, music-mirror).
    expect: 'checks=([6-9]|[1-9][0-9]+) ntfy=[1-9]'
    severity: warn
    task_id: sec-03
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # NAMES the down dead-mans (not just a count) so the daily re-page + last-summary
  # say WHICH monitoring subsystem is dark — the harness's daily reminder IS the nag
  # (self-hosted Healthchecks here has no SMTP, so its built-in email nag is a dead
  # end; only the ntfy channel works, and the sweep already re-pages while failing).
  - id: alert-healthchecks-none-down
    name: "no Healthchecks dead-man is in 'down' state"
    host: mini
    # `shell -v 0` suppresses Django 5.2's "N objects imported automatically"
    # auto-import banner (SM46, fix-61): during a genuine dead-man-down crit the
    # banner was line 1, so last-summary.md and the triage input showed the banner
    # instead of "down_checks=<which subsystem>" — defeating this check's purpose.
    cmd: docker exec healthchecks python3 /opt/healthchecks/manage.py shell -v 0 -c "from hc.api.models import Check; d=[c.name for c in Check.objects.all() if c.get_status()=='down']; print('down_checks='+(','.join(sorted(d)) if d else 'NONE'))"
    expect: '^down_checks=NONE$'
    severity: crit
    task_id: sec-03
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: alert-dsm-immich-task-scheduled
    name: "DSM crontab still carries the immich dump task (DSM wipes raw cron lines)"
    host: nas
    cmd: grep -c 'synoschedtask --run id=9' /etc/crontab
    expect: '^1$'
    severity: crit
    task_id: nas-08
    runbook: wiki/runbooks/backups.md
    enabled: true

  - id: alert-dsm-health-task-allday
    name: "DSM docker-health task runs all day (last-work-hour regression guard)"
    host: nas
    cmd: grep 'synoschedtask --run id=5' /etc/crontab | grep -c '0,1,2'
    expect: '^1$'
    severity: warn
    task_id: nas-08
    runbook: wiki/runbooks/alerting.md
    enabled: true

  - id: media-youtube-mounts-rw
    name: "YouTube pipeline mounts writable (pinchflat + metube + audio)"
    host: mini
    cmd: touch /mnt/nas-youtube/.verif-probe /mnt/nas-music-rw/YouTube/.verif-probe && rm /mnt/nas-youtube/.verif-probe /mnt/nas-music-rw/YouTube/.verif-probe && echo RW_OK
    expect: '^RW_OK$'
    severity: warn
    task_id: read-14
    runbook: wiki/runbooks/media.md
    enabled: true

  - id: alert-kuma-none-down
    name: "no Uptime Kuma monitor is down (47 fleet monitors seeded 2026-07-09)"
    host: mini
    cmd: docker exec uptime-kuma mariadb --socket=/app/data/run/mariadb.sock kuma -N -e "SELECT CONCAT('down=', COUNT(*)) FROM monitor m JOIN heartbeat h ON h.id=(SELECT MAX(id) FROM heartbeat WHERE monitor_id=m.id) WHERE m.active=1 AND h.status=0;"
    expect: '^down=0$'
    severity: warn
    task_id: sec-03
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # needs BESZEL_ADMIN_USER/BESZEL_ADMIN_PASSWORD in /etc/verification/env
  # (vault: beszel.admin_user / beszel.admin_password — never in this repo)
  - id: alert-beszel-none-down
    name: "Beszel hub shows no system down (mini/nas/rig agents, seeded 2026-07-09)"
    host: mini
    cmd: >-
      TOK=$(curl -s -m 8 -X POST http://localhost:8090/api/collections/_superusers/auth-with-password
      -H 'Content-Type: application/json'
      -d "{\"identity\":\"$BESZEL_ADMIN_USER\",\"password\":\"$BESZEL_ADMIN_PASSWORD\"}"
      | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])') &&
      curl -s -m 8 -H "Authorization: $TOK"
      'http://localhost:8090/api/collections/systems/records?filter=(status%3D%22down%22)'
      | python3 -c 'import json,sys; print("down="+str(json.load(sys.stdin)["totalItems"]))'
    expect: '^down=0$'
    severity: warn
    task_id: sec-03
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # ─── fix-63 · alerting-plane resilience (SH19/SM54/SL45/SL23/SM39) ─────────
  # The whole alerting plane lives ON mini, so these guard the OFF-mini and
  # recovery paths that make it survivable. They probe the CONSUMER end.

  # SH19 (class-level): prove SOMETHING that can page a mini outage lives OFF
  # mini and is actively running. The dead-man is a watcher on the rig that
  # pages via ntfy.sh; it heartbeats a file every run. Stale/absent heartbeat or
  # a stopped timer => the fleet has NO off-mini pager (the exact SH19 gap).
  - id: alert-offmini-deadman-armed
    name: "off-mini dead-man (rig watcher) is armed and fresh (SH19)"
    host: rig
    cmd: >-
      systemctl is-active --quiet mini-deadman.timer &&
      hb=$(cat /var/lib/mini-deadman/heartbeat 2>/dev/null || echo 0) &&
      age=$(( $(date +%s) - hb )) &&
      echo "armed age=${age}s $([ "$age" -lt 1200 ] && echo FRESH || echo STALE)"
    expect: 'armed age=[0-9]+s FRESH'
    severity: warn
    task_id: fix-63
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # SM54: rig-down WoL recovery must live in the FAST tier (10-min), not only in
  # the daily cycle (up to 24h latency). Config-regression guard: the fast unit
  # invokes the self-heal and the script is present+executable.
  - id: alert-wol-selfheal-fast-tier
    name: "rig WoL self-heal wired into the fast tier (SM54)"
    host: mini
    cmd: >-
      systemctl cat verification-fast.service 2>/dev/null | grep -q 'rig-wol-selfheal.sh' &&
      test -x /opt/verification/bin/rig-wol-selfheal.sh &&
      echo WOL_FAST_TIER_OK
    expect: '^WOL_FAST_TIER_OK$'
    severity: warn
    task_id: fix-63
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # SL23: the published status page must be REAL — probe the exact JSON the
  # Homepage widget + any shared status URL consume, and require non-empty groups
  # AND monitors (the old 'test' page rendered blank: 0 groups, 0 monitors).
  - id: alert-kuma-statuspage-nonempty
    name: "Uptime Kuma 'fleet' status page is published and non-empty (SL23)"
    host: mini
    cmd: >-
      curl -s -m 8 http://localhost:3001/api/status-page/fleet
      | python3 -c 'import json,sys; d=json.load(sys.stdin); g=d.get("publicGroupList",[]) or []; m=sum(len(x.get("monitorList",[]) or []) for x in g); print(f"groups={len(g)} monitors={m}")'
    expect: 'groups=[1-9][0-9]* monitors=[1-9][0-9]*'
    severity: warn
    task_id: fix-63
    runbook: wiki/runbooks/alerting.md
    enabled: true

  # SM39: prove the alert-delivery drill is actually being SENT (device receipt
  # is an operator human-confirm). Weekly timer; stale send => the last-mile
  # delivery test has silently stopped running.
  - id: alert-delivery-drill-fresh
    name: "synthetic alert-delivery drill sent within the last 8 days (SM39)"
    host: mini
    cmd: >-
      f=/var/lib/verification/alert-drill-last;
      test -f "$f" && s=$(sed -n 's/^sent_at=//p' "$f") &&
      age=$(( ( $(date +%s) - $(date -d "$s" +%s) ) / 86400 )) &&
      echo "drill_age_days=${age} $([ "$age" -le 8 ] && echo FRESH || echo STALE)"
    expect: 'drill_age_days=[0-9]+ FRESH'
    severity: warn
    task_id: fix-63
    runbook: wiki/runbooks/alerting.md
    enabled: true
