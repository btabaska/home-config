  # observability hardening (2026-07-14): stash had container coverage only. This
  # GraphQL version query proves the app + DB handshake (a static 200 could hide a
  # wedged backend). :9999 is published on the NAS host so mini can reach it.
  # fix-62/SM9: Stash enabled auth on the GraphQL endpoint ~2026-07-22, so the old
  # anonymous POST 401'd with a 0-byte body — the check could never pass and, with
  # no -w http_code and no failure branch, its stored output was EMPTY (zero
  # operator signal whether the pipe or the service broke). Now it sends the ApiKey
  # header (env STASH_API_KEY, vault homepage_widgets.stash_api_key) and always
  # emits an http_code so a 401 (auth regressed) vs 000 (service down) is legible.
  - id: stash-serving
    name: "stash answers its GraphQL version query with auth (:9999, real consumer end)"
    host: mini
    cmd: >-
      code=$(curl -s -m 8 -o /tmp/stash-ver.$$ -w '%{http_code}' -X POST http://nas:9999/graphql
      -H 'Content-Type: application/json' -H "ApiKey: $STASH_API_KEY"
      -d '{"query":"{version{version}}"}');
      body=$(cat /tmp/stash-ver.$$ 2>/dev/null); rm -f /tmp/stash-ver.$$;
      printf '%s' "$body" | grep -q '"version":"v[0-9]'
      && echo "stash=ok http=$code" || echo "stash=FAIL http=$code body=${body:0:60}"
    expect: '^stash=ok '
    severity: warn
    task_id: nas-01
    runbook: wiki/runbooks/nas.md
    enabled: true

  # beets = the YouTube-audio tagging layer (nas-30): MeTube writes audio to
  # /music/YouTube, beets tags strong MusicBrainz matches in place (fromfilename),
  # skips weak ones. NOT redundant with Lidarr (Lidarr writeAudioTags=sync handles
  # its own imports; beets only touches the non-Lidarr YouTube path). Two signals:
  # the always-on beet-web container serves :8337, and the daily import must run.
  - id: nas-beets
    name: "beets youtube-tagging web UI serving on :8337"
    host: mini
    cmd: curl -s -o /dev/null -m 8 -w '%{http_code}' http://nas:8337/
    expect: '^200$'
    severity: warn
    task_id: nas-30
    runbook: wiki/runbooks/nas.md
    enabled: true

  - id: nas-beets-ingest-fresh
    name: "beets youtube-ingest tagging ran recently (import.log < 30h)"
    host: nas
    cmd: >-
      find /volume1/docker/beets/import.log -mmin -1800 2>/dev/null
      | grep -q . && echo ingest=fresh || echo ingest=STALE
    expect: '^ingest=fresh$'
    severity: warn
    task_id: nas-30
    runbook: wiki/runbooks/nas.md
    enabled: true

  # seed-13 (2026-07-14): Whisparr v2 adult-scene automation feeds the Stash
  # library. /ping is unauthenticated and returns {"status":"OK"} only when the
  # app + its DB are actually serving (a wedged backend fails this), so it beats
  # bare container-liveness for the "up but broken" class shared by the other *arrs.
  - id: nas-whisparr
    name: "whisparr answers its /ping (adult automation :6969, seed-13)"
    host: mini
    cmd: curl -s -m 8 http://nas:6969/ping
    expect: '"status":\s*"OK"'
    severity: warn
    task_id: seed-13
    runbook: wiki/runbooks/nas.md
    enabled: true

  # fix-88 (seed-13 regression): the whisparr->stash Connect scan POSTed
  # metadataScan with NO ApiKey header, so Stash (auth enforced) 401'd every
  # auto-scan silently — a green-but-dead handoff. Fixed by injecting STASH_API_KEY
  # into whisparr's env (compose ${STASH_API_KEY:?} self-guards the env half —
  # whisparr won't start without it) and adding the header to /config/stash-scan.sh.
  # This guards the script half (a redeploy that drops the header). The authenticated
  # GraphQL path itself is covered by stash-serving above. Read is no-sudo (the
  # script is btabaska-owned).
  - id: whisparr-stash-scan-authed
    name: "whisparr->stash Connect scan sends the Stash ApiKey (fix-88, no more silent 401)"
    host: nas
    cmd: >-
      grep -q 'ApiKey' /volume1/docker/whisparr/config/stash-scan.sh
      && echo SCAN_AUTH_WIRED || echo SCAN_AUTH_MISSING
    expect: '^SCAN_AUTH_WIRED$'
    severity: warn
    task_id: fix-88
    runbook: wiki/runbooks/nas.md
    enabled: true

  # ---------------------------------------------------------------------------
  # IMMICH content checks (fix-35, 2026-07-18). The 2026-07-16 audit found the
  # flagship monitoring-vs-reality gap: every Immich probe (ping/version/dump
  # dead-man) was green for 14 days around a library with ZERO assets — the
  # mobile app was never paired, so the service's entire purpose (phone photo
  # backup) never happened (H17/H28). These two checks probe the CONTENT, not
  # the process. Both are expected to FAIL until a phone pairs — that alert is
  # the operator's standing reminder (decision 2026-07-18: prep now, pair later).
  # Auth: 'verification-monitor' API key (vault immich.verify_api_key), scoped
  # to server.statistics only, deployed as IMMICH_API_KEY in /etc/verification/env.
  # ---------------------------------------------------------------------------

  # REGRESSION (H17): photos actually exist AND landed recently, agreed by BOTH
  # the API (DB truth via admin statistics) and the filesystem (originals on
  # disk under /volume1/photo, world-readable). Catches never-flowed (now) and
  # stopped-flowing (later) with one invariant: fresh content within 7 days.
  # This is the AUTHORITATIVE "backups are flowing / a consumer is connected"
  # signal — it measures the real OUTCOME (fresh assets landing) regardless of
  # WHICH client uploaded them (native mobile app, web drag-drop, CLI). It
  # therefore subsumes the old nas-immich-mobile-paired proxy (retired nas-31).
  # fix-62/SH14: the old probe did an UNBOUNDED `ssh nas find /volume1/photo/{upload,
  # library} -mtime -7` over a ~4TB tree — 6m55s wall time on the busy DS920+, so it
  # exited 124 TIMEOUT every run and the flagship phone-backup dead-man was permanently
  # DARK (couldn't tell a real stall from its own timeout). Replaced with the same
  # OUTCOME asserted via the indexed Immich DB (O(1)): `search/metadata createdAfter=
  # now-7d` returns >0 when a fresh asset landed. Two signals stay separable — assets>0
  # (library non-empty) and fresh_7d>0 (backup flowing) — so STALE (assets>0, fresh=0),
  # EMPTY (assets=0) and PROBE_DEAD (api_err/err) are distinct. Completes in ~1s vs 60s
  # budget; touches no NAS filesystem, so it does not add to the I/O storm (fix-55).
  - id: nas-immich-backup-freshness
    name: "immich library has assets and a file landed in the last 7 days (phone backup flowing)"
    host: mini
    cmd: >-
      t=$(curl -sm 10 -H "x-api-key: $IMMICH_API_KEY" "$IMMICH_URL/api/server/statistics"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["photos"]+d["videos"])'
      2>/dev/null || echo api_err);
      since=$(date -u -d "-7 days" +%Y-%m-%dT%H:%M:%SZ);
      n=$(curl -sm 15 -H "x-api-key: $IMMICH_API_KEY" -H 'Content-Type: application/json'
      "$IMMICH_URL/api/search/metadata" -d "{\"createdAfter\":\"$since\",\"size\":1}"
      | python3 -c 'import sys,json;print(json.load(sys.stdin)["assets"]["total"])' 2>/dev/null || echo err);
      { [ "$t" != api_err ] && [ "$t" -gt 0 ] && [ "$n" != err ] && [ "$n" -gt 0 ]
      && echo backup=fresh; } || echo "backup=STALE assets=$t fresh_7d=$n"
    expect: '^backup=fresh$'
    severity: warn
    task_id: fix-35
    runbook: wiki/runbooks/photos.md
    enabled: true

  # RETIRED (nas-31, 2026-07-28): this was a PROXY for "a consumer is connected /
  # backups are flowing", asserting >=1 iOS/Android `session` row exists. Two
  # problems made it a permanent false alarm: (1) it tests an implementation
  # detail (a native-app login session) that is NOT the actual goal — this fleet
  # backs photos up via the WEB uploader, so fresh phone photos keep landing
  # (IMG_2114.jpg on 2026-07-27, 162 assets created that day) with ZERO native
  # mobile sessions ever recorded; (2) it can only be satisfied by a PHYSICAL
  # device pairing the Immich app — no server-side action can make it green.
  # Its regression intent (catch "server green but nothing is actually being
  # backed up") is fully and more strongly covered by nas-immich-backup-freshness
  # above, which asserts the real OUTCOME (fresh assets within 7 days) rather
  # than a session-row proxy. Re-pairing the native app is a user choice tracked
  # as a needs-human follow-up, not an automated monitor. Left disabled (not
  # deleted) for provenance; the daily sweep respects `enabled`, so this no
  # longer pages.
  - id: nas-immich-mobile-paired
    name: "immich has at least one mobile (iOS/Android) session paired"
    host: mini
    cmd: >-
      n=$(printf '%s\n' "$NAS_SUDO_PASSWORD"
      | ssh -o BatchMode=yes -o ConnectTimeout=10 nas
      "sudo -S -p '' /usr/local/bin/docker exec immich_postgres psql -U postgres -d immich
      -tAc \"SELECT count(*) FROM session WHERE \\\"deviceOS\\\" ILIKE '%ios%' OR \\\"deviceOS\\\" ILIKE '%android%'\""
      2>/dev/null); [ -n "$n" ] && [ "$n" -gt 0 ]
      && echo paired=yes || echo "paired=NO mobile_sessions=${n:-query_failed}"
    expect: '^paired=yes$'
    severity: warn
    task_id: fix-35
    runbook: wiki/runbooks/photos.md
    enabled: false

  # ═══ fix-60 (Immich cluster, 2026-08-02 fleet sweep) ═════════════════════════
  # SM36 · per-user photo throughput — the mandate-1 per-user signal. The global
  # nas-immich-backup-freshness asserts SOME file landed in 7d, so one active user
  # (Brandon) keeps it green forever while a SECOND household user's backup never
  # flows (Kaelyn: 0 photos/0 videos since her account was created 2026-07-14).
  # This probes the per-user OUTCOME via /api/server/statistics `usageByUser`
  # (verify key, server.statistics scope) and fails if ANY Immich user has zero
  # assets. EXPECTED-RED today: it is Kaelyn's standing onboarding reminder —
  # clearing it needs HER device (open the Immich app, sign in, enable backup: a
  # needs-human follow-up), no server-side action can. It also catches a NEW
  # family member who never backs up, or an existing user's library being wiped.
  - id: immich-user-zero-assets
    name: "every Immich user has >0 assets (per-user backup flowing, SM36)"
    host: mini
    cmd: >-
      curl -sm 12 -H "x-api-key: $IMMICH_API_KEY" "$IMMICH_URL/api/server/statistics"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);z=[u["userName"] for u in d["usageByUser"] if (u["photos"]+u["videos"])==0];print("per_user=ok" if not z else "per_user=ZERO:"+",".join(z))'
    expect: '^per_user=ok$'
    severity: warn
    task_id: fix-60
    runbook: wiki/docs/runbooks/photos.md
    enabled: true

  # SM1 regression · the corrupt IMG_3674.MOV stays quarantined from transcode.
  # asset 8a5d0a66 (a 2021 iPhone HEVC .mov carrying Frame-Cropping side data)
  # SIGSEGVs jellyfin-ffmpeg's preview decoder — dumping a 23MB core.gz to the
  # /volume1 root — EVERY midnight because Immich's nightly QUEUE_GENERATE_
  # THUMBNAILS(force=false) re-queues any asset missing a preview. Fix = inject a
  # placeholder preview + thumbnail asset_file so it is no longer "missing" and
  # drops out of the queue. This asserts the preview row still exists (a manual
  # force-regenerate would delete it and re-arm the nightly crash loop).
  - id: nas-immich-corrupt-mov-quarantined
    name: "corrupt IMG_3674 asset keeps its preview row (crash-loop quarantined, SM1)"
    host: mini
    cmd: >-
      n=$(printf '%s\n' "$NAS_SUDO_PASSWORD"
      | ssh -o BatchMode=yes -o ConnectTimeout=10 nas
      "sudo -S -p '' /usr/local/bin/docker exec immich_postgres psql -U postgres -d immich
      -tAc \"SELECT count(*) FROM asset_file WHERE \\\"assetId\\\"='8a5d0a66-9ee4-47d3-a058-c80eea7d53ba' AND type='preview'\""
      2>/dev/null); [ "$n" = 1 ] && echo quarantined=yes || echo "quarantined=NO cnt=${n:-err}"
    expect: '^quarantined=yes$'
    severity: warn
    task_id: fix-60
    runbook: wiki/docs/runbooks/photos.md
    enabled: true

  # SM1 class · no Immich ffmpeg transcode crash recurred. Sharper sibling of
  # nas-core-dumps (nas-host.yaml): the core file name encodes the crashing binary
  # (@ffmpeg…) and the immich_server container id, so this pins a RECURRING
  # transcode/preview crash-loop specifically to Immich (any corrupt asset the
  # nightly job keeps retrying), not just "a core exists somewhere on the NAS".
  - id: nas-immich-ffmpeg-nocrash
    name: "no Immich ffmpeg core dump at /volume1 root (transcode crash-loop class, SM1)"
    host: nas
    cmd: ls /volume1/ 2>/dev/null | grep -c '@ffmpeg.*core\.gz' || true
    expect: '^0$'
    severity: warn
    task_id: fix-60
    runbook: wiki/docs/runbooks/photos.md
    enabled: true

  # SL5 class · no future-dated asset hijacks the timeline. A single asset with a
  # corrupt EXIF capture date far in the future (Pic 127.jpg carried fileCreatedAt
  # 4501-01-01) permanently tops every date-descending view and skews newest-asset
  # freshness probes. Assert zero assets dated more than a year ahead.
  - id: nas-immich-no-future-dates
    name: "no Immich asset dated >1y in the future (timeline-hijack class, SL5)"
    host: mini
    cmd: >-
      n=$(printf '%s\n' "$NAS_SUDO_PASSWORD"
      | ssh -o BatchMode=yes -o ConnectTimeout=10 nas
      "sudo -S -p '' /usr/local/bin/docker exec immich_postgres psql -U postgres -d immich
      -tAc \"SELECT count(*) FROM asset WHERE \\\"fileCreatedAt\\\" > now() + interval '1 year' AND \\\"deletedAt\\\" IS NULL\""
      2>/dev/null); [ -n "$n" ] && [ "$n" = 0 ] && echo dates=ok || echo "dates=FUTURE n=${n:-err}"
    expect: '^dates=ok$'
    severity: warn
    task_id: fix-60
    runbook: wiki/docs/runbooks/photos.md
    enabled: true

  # SL29 class · the nightly pg-dump keep-N rotation is actually pruning. immich-
  # db-dump.sh keeps KEEP_DAYS of immich-*.sql.gz (~254MB each) and ships them
  # offsite via Hyper Backup. If the `find -delete` rotation silently stops, the
  # dir (and the B2 set) grows unbounded (the audit found 16 accumulating). Ceiling
  # of 10 catches that class while tolerating the day-boundary +1 (7-day retention
  # => 8 files steady state). Non-sudo: the backups dir is world-readable r-x.
  - id: nas-immich-dump-rotation
    name: "Immich pg-dump dir stays bounded by keep-N rotation (<=10 files, SL29)"
    host: nas
    cmd: >-
      n=$(ls /volume1/docker/immich/backups 2>/dev/null | grep -c 'immich-.*\.sql\.gz');
      [ "$n" -le 10 ] && echo "rotation=ok n=$n" || echo "rotation=BLOAT n=$n"
    expect: '^rotation=ok'
    severity: warn
    task_id: fix-60
    runbook: wiki/docs/runbooks/backup-restore.md
    enabled: true

  # home-07: the NAS beszel-agent breaks /volume1,2,3 out per-mount in the Beszel
  # dashboard via /extra-filesystems bind mounts (volume1 IS the agent's root disk;
  # volume2 -> dm-7, volume3 -> dm-6 show as extra filesystems — beszel labels
  # extras by their Synology cachedev device name). A recreate from a stale compose
  # would silently drop the split; this cred-free tripwire asserts the live compose
  # still declares all three mounts (the Fleet-tile data itself is browser-verified
  # + guarded by homepage-dead-tiles / homepage-widget-errors on the mini).
  - id: nas-beszel-volume-split
    name: "NAS beszel-agent still mounts all 3 volume extra-filesystems (home-07)"
    host: nas
    cmd: grep -c 'extra-filesystems/volume[123]:ro' /volume1/docker/beszel-agent/compose.yaml
    expect: '^3$'
    severity: warn
    task_id: home-07
    runbook: wiki/docs/runbooks/monitoring-coverage.md
    enabled: true

  # Jellyfin fully-local media server (media-05, parallel to Plex on :8096).
  # CONSUMER probe, not liveness: authenticates with an API key, asserts the
  # Movies + TV libraries actually contain items, AND range-GETs one movie's
  # stream (HTTP 206) to prove a real title is readable and served end-to-end.
  # A green /health says nothing about whether a title plays; this catches an
  # empty/broken scan or a lost media mount. warn (not crit): Jellyfin is the
  # plex.tv-independent parallel server; Plex keeps the crit media-path checks.
  # Runs from mini; JELLYFIN_API_KEY (dedicated 'verification' key) in runner env.
  - id: nas-jellyfin-serves
    name: "Jellyfin serves populated Movies+TV libraries AND streams a title (media-05)"
    host: mini
    cmd: python3 /opt/verification/bin/jellyfin-serves.py --key "$JELLYFIN_API_KEY"
    expect: '^JELLYFIN_OK'
    severity: warn
    task_id: media-05
    runbook: wiki/runbooks/nas.md
    enabled: true
