  # nas-readarr (:8787) removed 2026-07-20 — readarr decommissioned in bmig-05;
  # nas-bookshelf below is the books liveness check now.

  # books cutover bmig-02 (2026-07-20): Bookshelf (maintained Readarr fork,
  # hardcover variant) on :8790. Liveness only (302 = Forms-auth login
  # redirect); the full books-check migration is bmig-06.
