  # decommissioned in bmig-05; hardcover sibling below is the live provider.

  # books cutover bmig-01 (2026-07-20): hardcover-mode sibling on :8789 — the
  # metadata source for Bookshelf (bmig-02). Liveness only for now; the full
  # books-check migration (hardcover-token-valid Jan-1 expiry tripwire, search
  # canaries) lands in bmig-06. Image is a temporary local build (upstream
