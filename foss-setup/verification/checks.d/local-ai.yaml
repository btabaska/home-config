# Local-AI buildout (lai-*, run 12). SearXNG private metasearch on mini +
# the rig's local reranker (lai-02).
#
# Consumer-end probe, not liveness: containers-manifest-mini / containers-health-mini
# (docker-fleet.yaml) already prove the container is up. The real downstream consumer
# (Open WebUI web search / Agentic Research, lai-03) calls GET /search?q=...&format=json
# on the host port and needs REAL results back. This probe asserts exactly that, which
# catches the two ways the instance goes green-but-broken:
#   - `json` dropped from search.formats  -> HTTP 403 (invalid JSON -> python exits 1)
#   - limiter/botdetection re-enabled     -> HTTP 429 block page (same)
#   - all upstream engines dead (mini lost outbound DNS/net) -> results: [] -> BAD
# One shell-level retry with a second query rides out a single flaky engine sweep.
checks:
  - id: searxng-json-probe
    name: "SearXNG JSON API returns real results (lai-01 consumer end)"
    host: mini
    cmd: >-
      r=$(curl -s -m 20 'http://127.0.0.1:8888/search?q=wikipedia&format=json'
      | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))" 2>/dev/null);
      if [ "${r:-0}" -gt 0 ] 2>/dev/null; then echo "SEARXNG_OK results=$r";
      else sleep 3;
      r=$(curl -s -m 20 'http://127.0.0.1:8888/search?q=debian+linux&format=json'
      | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))" 2>/dev/null);
      if [ "${r:-0}" -gt 0 ] 2>/dev/null; then echo "SEARXNG_OK results=$r retry=1";
      else echo "SEARXNG_BAD results=${r:-invalid}"; fi; fi
    expect: '^SEARXNG_OK '
    severity: warn
    task_id: lai-01
    runbook: wiki/docs/runbooks/searxng.md
    enabled: true

  # rerank-spread (lai-02): the rig reranker (llama-swap qwen3-reranker, CPU) must
  # return a REAL relevance spread, not liveness. The specific failure this guards:
  # a community Qwen3-Reranker GGUF (broken classification head) serves 200s with
  # near-zero relevance_score for EVERYTHING — green-but-broken. So the probe sends
  # one clearly-relevant + one clearly-irrelevant document and asserts the relevant
  # doc scores high AND beats the irrelevant one by a wide margin. Scores are
  # sigmoid-normalized 0..1 (llama.cpp b10015); healthy baseline measured
  # 2026-08-05: rel=0.9945 irr=0.000026. Thresholds 0.5/0.4 are far from both the
  # healthy and the broken (~0 spread) modes. Runs from the mini over the tailnet
  # (same address as the rig.yaml llama-swap checks); generous timeout because the
  # first call after an idle unload cold-loads the 639MB model.
  - id: rerank-spread
    name: "llama-swap /v1/rerank scores relevant >> irrelevant (lai-02 broken-GGUF guard)"
    host: url
    timeout: 240
    cmd: >-
      python3 -c "import json,urllib.request;
      body=json.dumps({'model':'qwen3-reranker','query':'How do I restart a systemd service on Linux?','documents':['Use systemctl restart nginx.service to restart the unit, then systemctl status to confirm it is active again.','My favorite pancake recipe uses two eggs, a cup of flour, some milk and a pinch of salt.']}).encode();
      req=urllib.request.Request('http://cachyos.tailb31641.ts.net:9292/v1/rerank', data=body, headers={'Content-Type':'application/json'});
      r=json.load(urllib.request.urlopen(req, timeout=180));
      s={d['index']:d['relevance_score'] for d in r['results']};
      ok=s[0]>=0.5 and (s[0]-s[1])>=0.4;
      print(('RERANK_OK' if ok else 'RERANK_BAD')+' rel=%.4f irr=%.4f spread=%.4f'%(s[0],s[1],s[0]-s[1]))"
    expect: '^RERANK_OK '
    severity: warn
    task_id: lai-02
    runbook: wiki/docs/runbooks/rerank.md
    enabled: true

  # owui-agentic-search (lai-03): the CONSUMER end of OWUI web search. Two-stage probe
  # from the mini against the rig OWUI admin API (OWUI_URL/OWUI_API_KEY in runner env):
  #   1. config drift gate — the DB (PersistentConfig beats env, so compose seeds prove
  #      nothing) must still say: web search ON via searxng + hybrid RAG ON + external
  #      qwen3-reranker. Catches "someone flipped the engine/reranker back in the UI".
  #   2. POST /api/v1/retrieval/process/web/search — the exact code path a chat's
  #      search runs (and what the native search_web builtin tool executes) — must
  #      return real loaded results (OWUI -> mini SearXNG -> web loader fetches pages).
  # NO model call is involved (search+loader only), so this is GPU-contention-safe by
  # construction; still tier: daily because it fans out to live search engines + fetches
  # ~5 external pages (too heavy/flaky for the 10-min fast sweep). One shell-level retry
  # with a different query rides out a single engine-suspension sweep (SearXNG suspends
  # rate-limited engines for ~180s). Generous timeout: search + 5 page fetches can crawl.
  - id: owui-agentic-search
    tier: daily
    name: "OWUI web search consumer path returns SearXNG-sourced pages (lai-03)"
    host: mini
    timeout: 300
    cmd: >-
      w=$(curl -s -m 15 -H "Authorization:Bearer $OWUI_API_KEY" "$OWUI_URL/api/v1/retrieval/config"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);b=d.get("web",{});print("WIRED" if (b.get("ENABLE_WEB_SEARCH") and b.get("WEB_SEARCH_ENGINE")=="searxng" and b.get("SEARXNG_QUERY_URL","").startswith("http://192.168.10.2:8888/search") and d.get("ENABLE_RAG_HYBRID_SEARCH") and d.get("RAG_RERANKING_ENGINE")=="external" and d.get("RAG_RERANKING_MODEL")=="qwen3-reranker") else "DRIFT")' 2>/dev/null);
      if [ "$w" != "WIRED" ]; then echo "OWUI_SEARCH_BAD config=${w:-noresponse}"; else
      n=$(curl -s -m 110 -X POST -H "Authorization:Bearer $OWUI_API_KEY" -H "Content-Type:application/json"
      -d "{\"queries\":[\"debian stable release\"]}" "$OWUI_URL/api/v1/retrieval/process/web/search"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);print(int(d.get("loaded_count") or 0))' 2>/dev/null);
      if [ "${n:-0}" -gt 0 ] 2>/dev/null; then echo "OWUI_SEARCH_OK loaded=$n"; else sleep 5;
      n=$(curl -s -m 110 -X POST -H "Authorization:Bearer $OWUI_API_KEY" -H "Content-Type:application/json"
      -d "{\"queries\":[\"linux kernel news\"]}" "$OWUI_URL/api/v1/retrieval/process/web/search"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);print(int(d.get("loaded_count") or 0))' 2>/dev/null);
      if [ "${n:-0}" -gt 0 ] 2>/dev/null; then echo "OWUI_SEARCH_OK loaded=$n retry=1";
      else echo "OWUI_SEARCH_BAD loaded=${n:-invalid}"; fi; fi; fi
    expect: '^OWUI_SEARCH_OK '
    severity: warn
    task_id: lai-03
    runbook: wiki/docs/runbooks/owui-search-rag.md
    enabled: true

  # owui-mcp-tools (lai-04): OWUI's native MCP tool wiring. fleet-mcp (rig :8765/mcp,
  # fleet-mcp.service) + context7 (hosted) are native type-"mcp" streamable-HTTP tool
  # servers; time/fetch/serena/sequential-thinking stay on the mcpo OpenAPI bridge.
  # The connection list is PersistentConfig (DB-only — a volume wipe silently erases
  # it; canonical source = local-ai-tooling scripts/seed-owui-tool-servers.sh).
  # Helper (verification/bin/owui-mcp-tools.py) proves, from the mini:
  #   1. a REAL MCP handshake (initialize -> initialized -> tools/list) against
  #      fleet-mcp — the exact protocol conversation OWUI's MCPClient runs per chat;
  #   2. OWUI's admin API still shows BOTH mcp connections registered + enabled and
  #      fleet's function filter non-empty (9/10 tools; run_verification_checks out);
  #   3. the TOTAL OWUI-visible tool budget stays <= 40 (36 at build: fleet 9 +
  #      context7 2 + serena 21 + time 2 + fetch 1 + seq-thinking 1). mcpo bridges
  #      are live-counted, so a bridge mounting ZERO tools (the 2026-08-03 mcp
  #      SDK-2.0 McpError rename broke time+fetch exactly that way) FAILs here.
  # All-LAN, no model call, no external fan-out (context7 counted as a constant 2,
  # not live-probed) -> cheap enough for the fast sweep.
  - id: owui-mcp-tools
    name: "OWUI native MCP tool servers wired + visible-tool budget (lai-04)"
    host: mini
    timeout: 90
    cmd: python3 /opt/verification/bin/owui-mcp-tools.py
    expect: '^OWUI_MCP_OK '
    severity: warn
    task_id: lai-04
    runbook: wiki/docs/runbooks/owui-mcp-tools.md
    enabled: true

  # opencode-config-parity (lai-05): the opencode client config is dual-homed — repo
  # canonical (local-ai-tooling root opencode.json, with clients/ + agentic/opencode/
  # copies kept byte-identical) vs the rig's live ~/.config/opencode/. Same drift class
  # ai-tooling-clean-pushed guards, but for the DEPLOYED side: a live hotfix that never
  # lands in the repo (or a repo change never deployed) silently forks the agent's
  # behavior. Also pins the binary: clients/opencode.version is the single pinned-version
  # source (1.18.10 at build) — an autoupdate or ad-hoc upgrade FAILs here until the pin
  # file moves with it. Pure shell, runs on the rig like ai-tooling-clean-pushed.
  - id: opencode-config-parity
    name: "rig live opencode config == repo canonical AND pinned version installed (lai-05)"
    host: rig
    cmd: >-
      cd ~/Documents/GitHub/local-ai-tooling &&
      pin=$(cat clients/opencode.version) &&
      ver=$($HOME/.opencode/bin/opencode --version 2>/dev/null | tail -1) &&
      c1=$(sha256sum opencode.json | cut -c1-64) &&
      l1=$(sha256sum $HOME/.config/opencode/opencode.json | cut -c1-64) &&
      c2=$(sha256sum agentic/opencode/dcp.jsonc | cut -c1-64) &&
      l2=$(sha256sum $HOME/.config/opencode/dcp.jsonc | cut -c1-64) &&
      c3=$(sha256sum clients/opencode.json | cut -c1-64) &&
      c4=$(sha256sum agentic/opencode/opencode.json | cut -c1-64) &&
      echo "ver=$ver pin=$pin cfg live=${l1:0:12} repo=${c1:0:12} dcp live=${l2:0:12} repo=${c2:0:12}" &&
      { [ -n "$pin" ] && [ "$ver" = "$pin" ] && [ "$c1" = "$l1" ] && [ "$c2" = "$l2" ] && [ "$c3" = "$c1" ] && [ "$c4" = "$c1" ]; } &&
      echo OPENCODE-CONFIG-PARITY-OK
    expect: OPENCODE-CONFIG-PARITY-OK
    severity: warn
    task_id: lai-05
    runbook: wiki/docs/runbooks/git-hygiene.md
    enabled: true

  # opencode-run-probe (lai-05): consumer-end proof that the WHOLE opencode path works on
  # the rig — pinned binary starts, the 6 pinned plugins load, and a REAL completion goes
  # provider->LiteLLM->llama-swap and comes back (the exact custom-provider forwarding that
  # regressed in opencode 1.0.x #5674/#5210). Uses litellm/utility (fast-3b, temp 0): tiny,
  # loads in seconds, but it IS in the llama-swap big/swap group, so the probe momentarily
  # evicts whichever big model is resident — NVMe reload is seconds; daily 07:15 only (same
  # class as journaling-loop-e2e driving the coach model). Best-effort aware: severity warn,
  # and the opencode-ntfy.sh plugin firing an "Agent Idle" push on the `opencode` topic at
  # 07:15 is EXPECTED (doubles as a plugin-e2e heartbeat), not noise. LITELLM_API_KEY is
  # exported exactly the way the rig's ~/.bashrc does it (docker/.env CODING_LITELLM_KEY).
  - id: opencode-run-probe
    tier: daily
    name: "opencode run completes a real completion through LiteLLM on the rig (lai-05)"
    host: rig
    timeout: 300
    cmd: >-
      export LITELLM_API_KEY="$(grep -s "^CODING_LITELLM_KEY=" "$HOME/Documents/GitHub/local-ai-tooling/docker/.env" | cut -d= -f2-)" &&
      cd /tmp &&
      out=$(timeout 240 $HOME/.opencode/bin/opencode run -m litellm/utility "Reply with exactly: E2E_PROBE_OK. Do not use any tools." 2>/dev/null);
      if echo "$out" | grep -q "E2E_PROBE_OK"; then echo "OPENCODE_RUN_OK";
      else echo "OPENCODE_RUN_BAD tail=$(echo "$out" | tail -c 160 | tr "\n" " ")"; fi
    expect: '^OPENCODE_RUN_OK'
    severity: warn
    task_id: lai-05
    runbook: wiki/docs/architecture/local-ai-build.md
    enabled: true
