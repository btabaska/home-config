  - id: plant-scout-preset
    name: "Plant Scout preset intact (active, base=chat-vision, vision, identify_plant tool)"
    host: mini
    timeout: 30
    cmd: >-
      curl -s -m 15 -H "Authorization:Bearer $OWUI_API_KEY" "$OWUI_URL/api/v1/models/model?id=plant-scout"
      | python3 -c 'import sys,json;d=json.load(sys.stdin);m=d.get("meta") or {};ok=(d.get("is_active") and d.get("base_model_id")=="chat-vision" and (m.get("capabilities") or {}).get("vision") is True and "identify_plant" in (m.get("toolIds") or []) and "Rochester" in ((d.get("params") or {}).get("system") or ""));print("SCOUT_OK" if ok else "SCOUT_DRIFT "+json.dumps({"active":d.get("is_active"),"base":d.get("base_model_id"),"tools":m.get("toolIds")}))' 2>/dev/null
      || echo "SCOUT_DRIFT noresponse"
    expect: '^SCOUT_OK'
    severity: warn
    task_id: lai-22
    runbook: wiki/docs/runbooks/plant-id.md
    enabled: true
