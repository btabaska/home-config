# Mylar3 — western-comics automation (read-21)
# Role : the comics-native *arr (monitor + grabber + filer — Sonarr's role for western comics).
#        Primary acquisition is the built-in GetComics DDL provider (read-22); Prowlarr/torrent is
#        the read-23 fallback. ComicVine is the metadata authority (identity/catalog only, no files).
# Docs : https://github.com/mylar3/mylar3  •  https://docs.linuxserver.io/images/docker-mylar3/
# WHY NAS: the output tree /volume1/comics is a plain (non-SMB) dir — the mini/rig can't cleanly
#        mount it as a write target — so Mylar3 must run co-located on the NAS. Output lands in
#        /comics/Comics (= /volume1/comics/Comics), exactly where Komga's Comics library scans.
# uid  : PUID=1026/PGID=100 (btabaska:users) — MUST match Komga so files stay readable + NAS ACLs hold.
# ComicVine key: NOT injected via compose (the LSIO image has no CV env var) — it is stored in
#        /config/mylar/config.ini ([General] comicvine_api), sourced from vault comicvine.api_key.
#        See .env.example for the key name; the value never lands in the repo.
# To upgrade: bump the tag+digest below, then
#        ssh -t nas 'cd /volume1/docker/mylar3 && sudo /usr/local/bin/docker compose pull && sudo /usr/local/bin/docker compose up -d'
name: mylar3
services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest@sha256:4e105bb091e587bfa37d3d38b6e924695379e2b043e82037d33101396fa5eafc   # digest-pinned (fix-38/I68 supply-chain posture); pulled on the NAS 2026-07-27
    container_name: mylar3
    # fix-53 (fleet-sweep 2026-08-02, SM2/SM3) — fix-23 file-permission regression class.
    # mylar/ComicTagger were writing config.ini 0644 (23 credential-class keys) + world-writable
    # 0666/0777 cache/.ComicTagger files. This LSIO mylar3 image does NOT wire UMASK into its s6 run
    # script (svc-mylar3/run execs `s6-setuidgid abc python3 Mylar.py` with no `umask` call — verified
    # 2026-08-02), so the UMASK env var below is INERT on its own. We set umask at PID 1 instead: the
    # entrypoint runs `umask 077` then re-execs /init (s6-overlay), and every supervised service
    # inherits it. This secures config.ini's CREATE path (a fresh recreate lands it 0600 not 0644).
    # It does NOT secure the cache: mylar calls os.umask(0) WITHOUT restoring it (PostProcessor.py,
    # filechecker.py:1917/1946) so the process leaks to umask 0 after the first grab and re-chmods
    # cache/.ComicTagger 0666/0777 — that is handled OUT-OF-BAND by the every-15-min DSM task
    # scripts/nas/mylar3-perms-guard.sh (id=16). Safe at 077 because the ONLY consumer of
    # /volume1/comics is Komga, which also runs as UID 1026 (owner) — group/other access not needed.
    entrypoint: ["/bin/sh", "-c", "umask 077; exec /init"]
    environment:
      - PUID=1026                          # btabaska — matches Komga so grabbed CBZ stay readable
      - PGID=100                           # users
      - UMASK=077                          # see entrypoint note above (inert in this image; enforced at PID 1)
      - TZ=America/New_York
    volumes:
      - /volume1/docker/mylar3/config:/config   # config.ini + SQLite DB
      - /volume1/comics:/comics                 # comics library root — Comic Location is /comics/Comics
      # 2026-08-11: torrent import path fix. Mylar snatches to the seedbox Deluge (label
      # `mylar`) but had NO path to completed payloads — any torrent win stranded in
      # Snatched forever (DDL/GetComics masked it). Plain bind to match the *arr fleet:
      # after any host-side remount of /volume1/mounts/seedbox-files this container must
      # be restarted too. (shelfmark proves the better pattern — mount --make-rshared +
      # :rslave bind auto-recovers from remounts — fleet-wide migration is a follow-up;
      # note an rslave bind FAILS TO START while the rshared flag is missing, which
      # happens after every mid-life remount until boot-rshared.sh or an operator
      # re-applies it.)
      # Pairs with: Deluge label `mylar` move_completed -> files/mylar (set via RPC same
      # date) + config.ini deluge_done_directory=/seedbox/mylar.
      - /volume1/mounts/seedbox-files:/seedbox  # completed-torrent payloads (read via FUSE)
    ports:
      - '8090:8090'
    restart: unless-stopped
