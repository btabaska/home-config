# fix-69 (SL1, 2026-08-03) — silence the synologand geo-lookup flood in
# /var/log/messages. synologand logs "abnormal_login.cpp:112 Failed to get the
# info whose ip address is [100.x.x.x]" on every tailnet-source (CGNAT) login —
# benign geo-lookup misses (the source IP has no geo record). This flooded
# ~7-8k lines per messages file and drowned real DSM signal (fleet-sweep SL1).
# This filter matches ONLY that benign message; the companion file under
# include/not2msg/ excludes it from /var/log/messages. It does NOT touch real
# "abnormal login detected"/AbnormalAccess security alerts. Persistent /usr/local
# path survives DSM updates (mirrors Synology package pattern, e.g. ContainerManager.conf).
# Repo mirror: foss-setup/configs/nas/syslog-ng/
filter f_synologand_geo {
    program("synologand") and match("Failed to get the info whose ip address is" value("MESSAGE"));
};
