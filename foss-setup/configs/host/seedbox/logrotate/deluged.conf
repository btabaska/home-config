# fix-69 (SM18, 2026-08-03) — bound deluged.log growth on the shared seedbox.
# deluged.log flooded to 36MB, ~99% one libtorrent "outstanding_request_limit_reached"
# performance WARNING at ~1.1/sec, eating the tight user quota and drowning real
# ERROR lines. The launcher was also switched -L warning -> -L error (startup/deluge)
# so the flood stops at source on next deluged restart; this rotation caps the file
# meanwhile and keeps dated/compressed history so errors stay greppable across days.
# copytruncate: deluged (python logging FileHandler, append) keeps the fd open.
#
# LIVE PATH: ~/.config/logrotate/deluged.conf   (no root on the seedbox)
# CRON (append, do NOT clobber the fix-25/fix-45 reaper lines):
#   20 4 * * * /usr/sbin/logrotate -s ~/.config/logrotate/deluged.state ~/.config/logrotate/deluged.conf >/dev/null 2>&1
# Guard: check seedbox-deluged-log-bounded (task fix-69, seedbox.yaml) — <50M.
/home/hd34/btabaska/.config/deluge/deluged.log {
    daily
    rotate 5
    compress
    missingok
    notifempty
    copytruncate
    size 20M
}
