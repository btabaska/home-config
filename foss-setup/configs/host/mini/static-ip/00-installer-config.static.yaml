# APPLIED 2026-07-10 — live as /etc/netplan/00-installer-config.yaml on the mini
# (this file is the repo mirror; content matches live: 192.168.10.2/24 static,
# same routes/nameservers).
#
# Replaced the bare `dhcp4: true` that caused the recurring 24h DHCP-lease-expiry
# off-network outages (see the wiki reference/hosts/mini-network-resilience page,
# 2026-07-09 RCA). Paired with a UniFi DHCP reservation for MAC
# 98:5a:eb:ca:b2:ef -> .2. Re-apply steps in README-apply.md (netplan try).
network:
  version: 2
  renderer: networkd
  ethernets:
    enp3s0f0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.10.2/24
      routes:
        - to: default
          via: 192.168.10.1
          metric: 100
      nameservers:
        # parity with the DHCP-provided link DNS (AdGuard on mini, then nas, then gw)
        addresses: [192.168.10.2, 192.168.10.4, 192.168.10.1]
      link-local: [ipv6]
