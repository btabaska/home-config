# read-18 / fix-58 (SH13): order Docker AFTER the NAS CIFS mounts so containers
# never start before their bind sources are mounted.
#
# The mounts are `nofail` (a missing NAS must never block the Docker daemon or hang
# rig boot). But `nofail` ALSO strips the mount unit's implicit `Before=remote-fs.target`
# ordering — so `After=remote-fs.target` ALONE does NOT wait for a nofail mount. That
# gap caused fix-58 SH13: the 2026-08-01 boot started the `suwayomi` container 5s
# BEFORE `mnt-nas\x2dmanga.mount` became active (rprivate bind captured the empty
# pre-mount dir → the container saw ZERO downloads until a manual restart).
#
# lai-13 (2026-08-06): same treatment for mnt-nas\x2dzim.mount (RO zim library --
# mcpo bind-mounts /mnt/nas-zim for openzim-mcp).
#
# Fix: ALSO order Docker explicitly After= the specific manga mount, and Wants= it
# (pull it in WITHOUT Requires=, so a mount failure still lets Docker + every other
# container start). Ordering only — ≤30s worst-case boot delay if the NAS is down.
[Unit]
After=remote-fs.target mnt-nas\x2dmanga.mount mnt-nas\x2dzim.mount
Wants=mnt-nas\x2dmanga.mount mnt-nas\x2dzim.mount
