# fix-64 (SH4/SM53) — rig is a 24/7-mandate host (suspend is masked). A stray
# physical power-key press must NOT power the box off: the 2026-07-31 → 08-01
# outage left the rig dark for ~27h (AI stack + game servers + Suwayomi→Komga
# feed all down) because logind honored HandlePowerKey=poweroff.
#
# Ignore a short press. A deliberate long-press (~4s hold) stays as an explicit
# hardware poweroff path, and `sudo systemctl poweroff` always works for a planned
# CLI shutdown (root talks to systemd directly, bypassing logind/polkit). The
# desktop/plasma "Shut Down" menu path (the actual 07-31 trigger) is separately
# blocked by configs/host/rig/polkit/10-inhibit-desktop-poweroff.rules.
#
# Canonical source: configs/host/rig/logind/10-ignore-power-key.conf
# Deploy: install -m 644 to /etc/systemd/logind.conf.d/10-ignore-power-key.conf
#         then `sudo systemctl restart systemd-logind` (or reboot).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
