# fix-64 (SM15) — the rig ran TWO mDNS responders on UDP :5353 at once:
# avahi-daemon AND systemd-resolved's built-in MulticastDNS stub. Both probed and
# claimed the host record `cachyos.local`, so avahi lost the probe and renamed
# itself (cachyos-2, cachyos-3, … cachyos-8306) roughly once every 20s forever —
# 1,856 "Host name conflict" log lines per boot and flapping .local resolution.
# (Restricting avahi to enp10s0 removed the separate docker-veth-churn conflicts,
# but not this host-internal avahi-vs-resolved fight.)
#
# avahi is the canonical, feature-complete mDNS responder (it is what Apollo /
# Moonlight game-streaming discovery registers through), so disable resolved's
# lightweight stub and let avahi own mDNS uncontested. Regular unicast DNS via
# systemd-resolved is unaffected.
#
# Canonical source: configs/host/rig/resolved/10-disable-mdns.conf
# Deploy: install -m 644 to /etc/systemd/resolved.conf.d/10-disable-mdns.conf
#         then `sudo systemctl restart systemd-resolved`.
[Resolve]
MulticastDNS=no
