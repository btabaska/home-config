# ollama systemd override — DOC-ONLY mirror of rig /etc/systemd/system/ollama.service.d/override.conf
# (fix-102 anti-drift; rig host config is doc-only per CLAUDE.md). The HA-Assist compat shim:
# KEEP_ALIVE=0 unloads immediately (frees VRAM for llama-swap); 2 loaded models max; single parallel.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=0"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_NUM_PARALLEL=1"
