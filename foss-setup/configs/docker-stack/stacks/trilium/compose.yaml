# Trilium (TriliumNext) — self-hosted notes / knowledge base.
# Obsidian-replacement trial (read-27, 2026-08-03). Runs on the Mac mini docker stack.
#
# Docs:
#   - Server install:  https://docs.triliumnotes.org/user-guide/setup/server/installation/docker
#   - Image:           https://hub.docker.com/r/triliumnext/trilium
#   - Reverse proxy:   https://docs.triliumnotes.org/user-guide/setup/server/reverse-proxy/trusted-proxy
#   - Obsidian import: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/obsidian
#
# PINNED to v0.104.1 — NEVER use :latest. Minor bumps migrate the SQLite schema and can
# break the DB/sync. To upgrade: bump the tag, read the release notes, then
# `docker compose pull && docker compose up -d`.
#
# ALL state lives in ./data (SQLite document.db + config.ini + sessions + Trilium's own
# auto-backups). To fully revert the trial: `docker compose down` and delete this dir —
# that is the entire footprint. One-command teardown:
#   foss-setup/scripts/notes-trial/teardown-trilium.sh
#
# Single-user login is set in the first-run setup wizard at https://trilium.tabaska.us
# (no secrets in env). LAN/tailnet posture — Caddy is the only public listener, so no host
# port is published; Caddy reaches the container by name on the shared `edge` network.

name: trilium

services:
  trilium:
    image: triliumnext/trilium:v0.104.1
    container_name: trilium
    restart: unless-stopped
    environment:
      # Trust the mini's Caddy reverse proxy: correct client IPs, https URL generation,
      # and rate limiting. This is config.ini [Network] trustedReverseProxy set via env
      # (env key has NO word separators — TRILIUM_NETWORK_TRUSTEDREVERSEPROXY).
      # NB: this version passes the value straight to Express `trust proxy`, which parses a
      # STRING as an IP/CIDR list — so the literal `true` crashes with "invalid IP address:
      # true". Use the Express preset `uniquelocal` (trusts private ranges: 10/8, 172.16/12,
      # 192.168/16) which covers Caddy's IP on the docker `edge` bridge.
      - TRILIUM_NETWORK_TRUSTEDREVERSEPROXY=uniquelocal
      - TZ=America/New_York
    volumes:
      # One dir = the whole footprint (SQLite DB + config + sessions + backups).
      - ./data:/home/node/trilium-data
    networks:
      - edge
    # The image ships its own HEALTHCHECK (docker_healthcheck.cjs); no override needed.

networks:
  edge:
    external: true
