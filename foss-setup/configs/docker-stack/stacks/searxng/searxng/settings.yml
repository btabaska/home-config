# SearXNG instance settings (lai-01) — merged over the image's full defaults via
# use_default_settings, so engines/categories/UI stay upstream-default and keep
# working across image bumps.
#
# TWO deliberate choices, both load-bearing for the local-AI stack (lai-03):
#   1. search.formats includes `json` — Open WebUI / agents consume
#      GET /search?q=...&format=json. Without `json` here SearXNG answers 403.
#      OWUI strips any `&format=json` baked into SEARXNG_QUERY_URL, so this
#      server-side list is the ONLY way to enable the JSON API.
#   2. server.limiter: false — the default limiter/bot-detection classifies
#      plain API clients (curl, OWUI) as bots and blocks them. This is a
#      private LAN/tailnet instance (no WAN exposure), so the limiter is off.
#
# server.secret_key is deliberately NOT set here — it comes from the
# SEARXNG_SECRET env var (./.env, vault searxng.secret_key). Never put the key
# in this file: it is committed to both repos.

use_default_settings: true

general:
  instance_name: "SearXNG"
  debug: false

server:
  limiter: false
  public_instance: false
  image_proxy: true
  # secret_key: set via SEARXNG_SECRET env — see header.

search:
  # html for humans (via https://searxng.tabaska.us), json for the AI stack.
  formats:
    - html
    - json
