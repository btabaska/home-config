# Meme Review — self-hosted image-reaction app (imported from a Claude Design
# prototype; see README.md + HANDOFF.md). Joins the shared `edge` network so
# Caddy reaches it by container name (memes.tabaska.us -> meme-review:8787).
#
# Data (SQLite DB + uploads + Immich thumbnail cache) lives in ./data, which sits
# under /opt/stacks and is therefore covered by the existing restic backup job.

services:
  meme-review:
    build: .
    container_name: meme-review
    restart: unless-stopped
    environment:
      - PORT=8787
      - DATA_DIR=/data
      - COOKIE_SECURE=true # behind Caddy HTTPS
      - GUEST_REACTIONS=members
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Immich is optional and also settable at runtime in the app's Settings screen.
      - IMMICH_BASE_URL=${IMMICH_BASE_URL:-}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - IMMICH_DEFAULT_ALBUM_ID=${IMMICH_DEFAULT_ALBUM_ID:-}
    volumes:
      - ./data:/data
    networks:
      - edge

networks:
  edge:
    external: true
